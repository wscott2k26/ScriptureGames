name: Monitor Build 17 Source Patch

on:
  push:
    branches:
      - monitor/build17-source-patch
    paths:
      - '.github/status-triggers/monitor-build17-source-patch.md'

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Find source patch run
        id: find
        shell: bash
        run: |
          set -euo pipefail
          run_id=''
          for attempt in $(seq 1 120); do
            run_id=$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/apply-build17-scripture-links.yml/runs?branch=fix%2Fbuild-17-universal-scripture-links&event=push&per_page=10" --jq '.workflow_runs | sort_by(.created_at) | reverse | .[0].id // empty')
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          status=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status')
          gh pr comment 51 --repo "$GITHUB_REPOSITORY" --body "Build 17 source-patch monitor: run \`$run_id\` is \`$status\`. This monitor is read-only."

      - name: Wait for terminal result
        shell: bash
        run: |
          set -euo pipefail
          run_id='${{ steps.find.outputs.run_id }}'
          for attempt in $(seq 1 480); do
            status=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status')
            conclusion=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.conclusion // empty')
            if [ "$status" = 'completed' ]; then break; fi
            sleep 10
          done
          test "$status" = 'completed'
          gh pr comment 51 --repo "$GITHUB_REPOSITORY" --body "Build 17 source-patch terminal result: run \`$run_id\` completed with \`$conclusion\`."
          test "$conclusion" = 'success'
