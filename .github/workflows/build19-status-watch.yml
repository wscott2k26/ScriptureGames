name: Build 19 Release Status Watch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build19-status-watch.yml'

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_HEAD_SHA: fc629776cc6804ef4ef20fa0a8ac0412f19a25c6
    steps:
      - name: Wait for the authorized Build 19 release run
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          release_run=""
          for attempt in $(seq 1 120); do
            release_run="$(gh run list --repo "$repo" --workflow ios-cloud-update.yml --branch main --limit 20 --json databaseId,status,conclusion,headSha,createdAt,url --jq 'map(select(.headSha == env.EXPECTED_HEAD_SHA)) | .[0] // empty')"
            if [ -n "$release_run" ]; then
              status="$(printf '%s' "$release_run" | jq -r '.status')"
              if [ "$status" = "completed" ]; then
                break
              fi
            fi
            sleep 30
          done
          test -n "$release_run" || { echo 'Authorized Build 19 release run was not found.' >&2; exit 1; }
          run_id="$(printf '%s' "$release_run" | jq -r '.databaseId')"
          status="$(printf '%s' "$release_run" | jq -r '.status')"
          conclusion="$(printf '%s' "$release_run" | jq -r '.conclusion // "pending"')"
          head_sha="$(printf '%s' "$release_run" | jq -r '.headSha')"
          run_url="$(printf '%s' "$release_run" | jq -r '.url')"
          details="$(gh run view "$run_id" --repo "$repo" --json jobs,status,conclusion,url)"
          body=$(cat <<EOF
Build 19 release status watcher completed.

- Release run: $run_id
- Status: $status
- Conclusion: $conclusion
- Launcher commit: $head_sha
- URL: $run_url

Jobs:
\`\`\`json
$details
\`\`\`
EOF
)
          gh issue create --repo "$repo" --title "Build 19 release result — $conclusion — run $run_id" --body "$body"
          test "$status" = "completed"
          test "$conclusion" = "success"
