name: Build 20 Recovery Assemble and Verify
# Recovery attempt 4: audit the proven shared ScriptureLink and Bible tab.

on:
  push:
    branches:
      - recovery/build20-build18-plus-mastery
    paths:
      - '.github/workflows/build20-recovery.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: scripture-games-build20-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact Build 18 recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery/build20-build18-plus-mastery
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global yarn@1.22.22
          python -m pip install --disable-pip-version-check --no-cache-dir Pillow==11.3.0
          cd frontend
          yarn install --frozen-lockfile --non-interactive --network-timeout 600000

      - name: Merge mastery history while preserving Build 18 conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin feature/chronological-quiz-books main
          set +e
          git merge --no-commit --no-ff -X ours origin/feature/chronological-quiz-books
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            test -n "$conflicts" || exit "$merge_status"
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              git checkout --ours -- "$file"
              git add "$file"
            done <<< "$conflicts"
          fi

      - name: Prove the recovery contract is red before implementation
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          set +e
          node --experimental-strip-types scripts/test-build20-recovery.ts > /tmp/build20-red.log 2>&1
          red_status=$?
          set -e
          cat /tmp/build20-red.log
          if [ "$red_status" -eq 0 ]; then
            echo 'Recovery test unexpectedly passed before implementation.' >&2
            exit 1
          fi
          grep -Eq 'Gentle Rain|Quiet Reading Room|Ten-book Book Mastery|Old Testament mastery shelf|Proven Scripture link reuse' /tmp/build20-red.log

      - name: Assemble Build 18 plus mastery and three ambient choices
        shell: bash
        run: |
          set -euo pipefail
          python scripts/recover-build20.py
          python scripts/patch-build20-audit.py

      - name: Prove the recovery contract is green
        working-directory: frontend
        run: yarn test:build20

      - name: Run focused chronology and mastery gates
        working-directory: frontend
        run: |
          yarn test:quiz-ordering
          yarn test:book-mastery
          yarn audit:book-mastery

      - name: Run complete Build 12 through Build 20 validation
        working-directory: frontend
        run: yarn validate

      - name: Remove one-use recovery machinery and commit verified source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/build20-recovery.yml scripts/recover-build20.py scripts/patch-build20-audit.py
          git add -A
          git status --short
          git commit -m 'fix: restore Build 18 experience and layer verified mastery'
          git push origin HEAD:recovery/build20-build18-plus-mastery

      - name: Record verified recovery
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title 'Build 20 recovery source verified — no EAS run' \
            --body "Recovered from exact Build 18 source and merged chronological ten-book mastery without replacing proven Lumi, background, piano, Premium, Journey, or Scripture-link systems. Added bundled Gentle Rain and Quiet Reading Room ambience. Full validation passed, including Build 12–20 tests, Bible audits, Expo Doctor, TypeScript, ESLint, and local iOS/Android exports.\n\nVerified recovery commit: \`$sha\`\n\nNo EAS build, TestFlight upload, Android cloud build, App Review submission, or public release occurred."

      - name: Report exact recovery blocker
        if: failure()
        shell: bash
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Build 20 recovery needs attention — run $GITHUB_RUN_ID" \
            --body "The recovery stopped before any EAS or TestFlight action. Review: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
