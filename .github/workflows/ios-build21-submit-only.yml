name: Scripture Games Build 21 TestFlight Submit Only

on:
  push:
    branches:
      - release/build21-testflight-final-submit
    paths:
      - '.github/status-triggers/ios-build21-submit-authorized.md'

permissions:
  contents: read
  issues: write

concurrency:
  group: scripture-games-build21-testflight-submit-only-final
  cancel-in-progress: false

jobs:
  submit:
    name: Submit exact verified Build 21 to TestFlight
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      BUILD_ID: f93a4447-8cc4-45ad-acd6-307f4133ec3e
      BUILD_SOURCE_SHA: 80ee3c601ecc7e34a915e66472856c8d0c2287c2
      VERIFIED_APP_SOURCE_SHA: 50f935d5bd69a9fea2b29bc74cba3dd7c9375180
      EAS_PROJECT_ID: 18710e80-2a62-46ac-8d3a-d1711b7d920a

    steps:
      - name: Check out submit-only branch
        uses: actions/checkout@v4
        with:
          ref: release/build21-testflight-final-submit
          fetch-depth: 0

      - name: Verify explicit authorization and unchanged app source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "release/build21-testflight-final-submit"
          test -f .github/status-triggers/ios-build21-submit-authorized.md
          grep -Fq 'AUTHORIZED: submit exact existing iOS Build 21 to TestFlight.' .github/status-triggers/ios-build21-submit-authorized.md
          grep -Fq 'NO NEW EAS BUILD.' .github/status-triggers/ios-build21-submit-authorized.md
          grep -Fq 'NO ANDROID BUILD.' .github/status-triggers/ios-build21-submit-authorized.md
          grep -Fq 'NO APP REVIEW OR PUBLIC RELEASE.' .github/status-triggers/ios-build21-submit-authorized.md
          git merge-base --is-ancestor "$VERIFIED_APP_SOURCE_SHA" HEAD
          git diff --exit-code "$BUILD_SOURCE_SHA" HEAD -- frontend backend scripts supabase support-site
          test -n "${EXPO_TOKEN:-}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Authenticate Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: 16.20.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install frozen app dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          yarn install --frozen-lockfile --non-interactive --network-timeout 600000

      - name: Verify Expo identity and exact finished Build 21
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          eas whoami | tee /tmp/eas-whoami.txt
          grep -Eq '^wscott2k8([[:space:]]|$)' /tmp/eas-whoami.txt
          eas project:info --non-interactive | tee /tmp/eas-project.txt
          grep -q "$EAS_PROJECT_ID" /tmp/eas-project.txt
          eas build:view "$BUILD_ID" --json > /tmp/build21.json
          python -m json.tool /tmp/build21.json
          jq -e '
            .id == env.BUILD_ID and
            .platform == "IOS" and
            .project.id == env.EAS_PROJECT_ID and
            .distribution == "STORE" and
            .buildProfile == "production" and
            .appVersion == "1.0.0" and
            .appBuildVersion == "21" and
            .status == "FINISHED" and
            .isForIosSimulator == false and
            .gitCommitHash == env.BUILD_SOURCE_SHA and
            (.submission == null) and
            (((.submissions // []) | length) == 0)
          ' /tmp/build21.json

      - name: Submit exact existing Build 21 to TestFlight
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          eas submit --platform ios --profile production --id "$BUILD_ID" --non-interactive | tee ../ios-build21-submit.log

      - name: Save submission record
        uses: actions/upload-artifact@v4
        with:
          name: scripture-games-build21-testflight-submission
          path: ios-build21-submit.log
          if-no-files-found: error
          retention-days: 90

      - name: Report successful Build 21 submission
        shell: bash
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Build 21 submitted to TestFlight" --body "Submitted exact existing iOS Build 21 to App Store Connect/TestFlight. EAS build ID: $BUILD_ID. Build source: $BUILD_SOURCE_SHA, with verified application source $VERIFIED_APP_SOURCE_SHA. No new EAS build, Android build, App Review submission, or public release occurred. Workflow run: $GITHUB_RUN_ID. Apple processing confirmation is still required before declaring it available in TestFlight."

      - name: Report submission blocker without retrying
        if: failure()
        shell: bash
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Build 21 final TestFlight submission stopped" --body "The final submit-only workflow stopped in run $GITHUB_RUN_ID. Target EAS build ID: $BUILD_ID. It contains no EAS build command and did not authorize Build 22, Android, App Review, or public release. No automatic retry is authorized."
