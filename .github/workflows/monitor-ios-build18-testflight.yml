name: Monitor Scripture Games iOS Build 18 TestFlight

on:
  push:
    branches:
      - monitor/build18-testflight-status
    paths:
      - '.github/status-triggers/ios-build18-monitor.md'

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: monitor-scripture-games-ios-build18-testflight
  cancel-in-progress: false

jobs:
  monitor:
    name: Observe the one authorized Build 18 release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      AUTHORIZED_SHA: b735435933cd0e37a50c7d0b2737729c61ff63f4

    steps:
      - name: Check out isolated monitoring source
        uses: actions/checkout@v4
        with:
          ref: monitor/build18-testflight-status
          fetch-depth: 1

      - name: Locate and wait for the authorized release run
        id: release
        shell: bash
        run: |
          set -euo pipefail
          release_run=''
          for _ in $(seq 1 100); do
            release_run=$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/ios-build18-testflight-once.yml/runs?branch=fix%2Fbuild-18-scripture-reference-runtime&event=push&per_page=20" \
              --jq '[.workflow_runs[] | select(.head_sha == env.AUTHORIZED_SHA)] | sort_by(.created_at) | reverse | .[0] // empty')
            if [ -n "$release_run" ]; then
              status=$(jq -r '.status' <<<"$release_run")
              run_id=$(jq -r '.id' <<<"$release_run")
              echo "Observed release run $run_id with status $status."
              if [ "$status" = 'completed' ]; then
                break
              fi
            fi
            sleep 15
          done

          test -n "$release_run"
          test "$(jq -r '.head_sha' <<<"$release_run")" = "$AUTHORIZED_SHA"
          test "$(jq -r '.status' <<<"$release_run")" = 'completed'

          run_id=$(jq -r '.id' <<<"$release_run")
          conclusion=$(jq -r '.conclusion' <<<"$release_run")
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"

          if [ "$conclusion" != 'success' ]; then
            gh pr comment 52 --repo "$GITHUB_REPOSITORY" --body "Build 18 release run $run_id completed with conclusion **$conclusion**. No retry or second EAS build is authorized."
            exit 1
          fi

      - name: Download and validate the signed-build record
        if: steps.release.outputs.conclusion == 'success'
        id: record
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/build18-record
          gh run download "${{ steps.release.outputs.run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name scripture-games-ios-build18-testflight-record \
            --dir /tmp/build18-record

          record=/tmp/build18-record/ios-build18-testflight.json
          test -f "$record"
          jq -e '
            length == 1 and
            .[0].platform == "IOS" and
            .[0].appVersion == "1.0.0" and
            .[0].appBuildVersion == "18" and
            .[0].gitCommitHash == env.AUTHORIZED_SHA and
            (.[0].submissions | length) == 1 and
            .[0].submissions[0].platform == "IOS"
          ' "$record"

          build_id=$(jq -r '.[0].id' "$record")
          submission_id=$(jq -r '.[0].submissions[0].id' "$record")
          build_number=$(jq -r '.[0].appBuildVersion' "$record")
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
          echo "submission_id=$submission_id" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

      - name: Report exact delivery record
        if: steps.release.outputs.conclusion == 'success'
        shell: bash
        run: |
          set -euo pipefail
          gh pr comment 52 --repo "$GITHUB_REPOSITORY" --body "Build 18 release run **${{ steps.release.outputs.run_id }}** completed successfully. Exactly one iOS production build and one TestFlight auto-submit were recorded. Build ID: `${{ steps.record.outputs.build_id }}`. Submission ID: `${{ steps.record.outputs.submission_id }}`. App version/build: `1.0.0 (${{ steps.record.outputs.build_number }})`. No Android cloud build, App Review submission, public release, merge, or automatic retry was performed. Apple may still need to finish TestFlight processing."
