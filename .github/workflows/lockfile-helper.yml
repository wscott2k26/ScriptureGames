name: Scripture Games Lockfile Helper

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.head_ref == 'fix/full-app-stability-4x'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Generate deterministic lockfile
        run: |
          npm install --global yarn@1.22.22
          cd frontend
          yarn install --non-interactive
      - name: Commit updated lockfile once
        run: |
          git config user.name "scripture-games-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/yarn.lock
          if git diff --cached --quiet; then
            echo "Lockfile already current."
          else
            git commit -m "build: lock premium audio dependencies"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
