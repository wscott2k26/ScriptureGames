name: Watch Build 15 EAS Submission

on:
  push:
    branches:
      - fix/build-15-piano-premium-boundary
    paths:
      - '.github/status-triggers/watch-build15-eas-submission.md'

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      BUILD_ID: fbf84fb6-515f-4ffe-a295-e611f056aa26
      SUBMISSION_ID: ba25bb84-4f2d-42e9-8460-582edae16029
    steps:
      - name: Query current submission state
        id: current
        shell: bash
        run: |
          set -euo pipefail
          payload=$(jq -n --arg submissionId "$SUBMISSION_ID" '{query:"query SubmissionsByIdQuery($submissionId: ID!) { submissions { byId(submissionId: $submissionId) { id status platform createdAt updatedAt } } }",variables:{submissionId:$submissionId}}')
          query_submission() {
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $EXPO_TOKEN" \
              -H 'Content-Type: application/json' \
              --data "$payload" \
              https://api.expo.dev/graphql
          }
          response=$(query_submission)
          if jq -e '.errors and (.errors | length > 0)' <<<"$response" >/dev/null; then
            jq '.errors' <<<"$response" >&2
            exit 1
          fi
          status=$(jq -r '.data.submissions.byId.status // "UNKNOWN"' <<<"$response")
          updated=$(jq -r '.data.submissions.byId.updatedAt // "UNKNOWN"' <<<"$response")
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Current Build 15 submission status: $status ($updated)"
          gh pr comment 46 --repo "$GITHUB_REPOSITORY" --body "Build 15 EAS submission snapshot: build \`$BUILD_ID\`, submission \`$SUBMISSION_ID\`, status **$status**, updated \`$updated\`. Read-only query; no new build or submission was created."

      - name: Poll existing submission to terminal state
        shell: bash
        run: |
          set -euo pipefail
          payload=$(jq -n --arg submissionId "$SUBMISSION_ID" '{query:"query SubmissionsByIdQuery($submissionId: ID!) { submissions { byId(submissionId: $submissionId) { id status platform createdAt updatedAt } } }",variables:{submissionId:$submissionId}}')
          status='${{ steps.current.outputs.status }}'
          updated='UNKNOWN'
          for attempt in $(seq 1 600); do
            case "$status" in
              FINISHED|ERRORED|CANCELED) break ;;
            esac
            sleep 15
            response=$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $EXPO_TOKEN" \
              -H 'Content-Type: application/json' \
              --data "$payload" \
              https://api.expo.dev/graphql)
            if jq -e '.errors and (.errors | length > 0)' <<<"$response" >/dev/null; then
              jq '.errors' <<<"$response" >&2
              exit 1
            fi
            status=$(jq -r '.data.submissions.byId.status // "UNKNOWN"' <<<"$response")
            updated=$(jq -r '.data.submissions.byId.updatedAt // "UNKNOWN"' <<<"$response")
            echo "Build 15 submission status: $status ($updated)"
          done
          case "$status" in
            FINISHED|ERRORED|CANCELED) ;;
            *) echo "Submission did not reach a terminal state." >&2; exit 1 ;;
          esac
          gh pr comment 46 --repo "$GITHUB_REPOSITORY" --body "Build 15 EAS submission terminal state: build \`$BUILD_ID\`, submission \`$SUBMISSION_ID\`, status **$status**, updated \`$updated\`. Read-only query; no new build or submission was created."
          test "$status" = 'FINISHED'
