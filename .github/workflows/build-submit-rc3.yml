name: Build and Submit RC3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-submit-rc3.yml'
  workflow_run:
    workflows:
      - Certify and Merge RC3
    types:
      - completed

permissions:
  contents: write
  actions: read
  issues: write

jobs:
  signed-builds:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out certified main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Confirm RC3 source is on main
        shell: bash
        run: |
          set -euo pipefail
          test -f frontend/package.json
          test -f frontend/app.json
          test -f frontend/eas.json
          test -f scripts/audit-visual-master.py
          test -f CINEMATIC_VISUAL_MASTER_RC3.md

      - name: Confirm protected Expo token is available
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "EXPO_TOKEN is missing from repository Actions secrets." >&2
            exit 1
          fi
          echo "Expo token is present and protected."

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global yarn@1.22.22
          cd frontend
          yarn install --frozen-lockfile --non-interactive

      - name: Verify connected Expo project
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          eas whoami
          eas project:info --non-interactive
          npx expo config --type public > /tmp/expo-public-config.txt
          grep -q '18710e80-2a62-46ac-8d3a-d1711b7d920a' /tmp/expo-public-config.txt
          grep -q 'com.willywill.scripturegames' /tmp/expo-public-config.txt

      - name: Build Android preview APK
        id: android
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --json > ../android-build.json
          python -m json.tool ../android-build.json

      - name: Build and submit iOS production binary
        id: ios
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          eas build \
            --platform ios \
            --profile production \
            --non-interactive \
            --auto-submit \
            --json > ../ios-build.json
          python -m json.tool ../ios-build.json

      - name: Save signed-build records
        uses: actions/upload-artifact@v4
        with:
          name: scripture-games-rc3-signed-build-records
          path: |
            android-build.json
            ios-build.json
          if-no-files-found: error
          retention-days: 90

      - name: Record successful signed-build handoff
        shell: bash
        run: |
          set -euo pipefail
          cat > SIGNED_BUILD_STATUS.md <<EOF
          # Scripture Games RC3 Signed Build Status

          - GitHub run: $GITHUB_RUN_ID
          - Expo authentication: passed
          - Android preview build: requested/completed by EAS
          - iOS production build and TestFlight submission: requested/completed by EAS
          - Recorded: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          EOF
          git config user.email actions@users.noreply.github.com
          git config user.name 'Scripture Games CI'
          git add SIGNED_BUILD_STATUS.md
          git commit -m 'Record successful RC3 signed-build handoff' || true
          git push origin HEAD:main

      - name: Report signed-build blocker
        if: failure()
        shell: bash
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "RC3 signed-build-only run needs attention — $GITHUB_RUN_ID" --body "Review: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
