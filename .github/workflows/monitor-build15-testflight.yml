name: Monitor Build 15 TestFlight Retry

on:
  push:
    branches:
      - monitor/build15-testflight-status
    paths:
      - '.github/status-triggers/monitor-build15-testflight.md'

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      EXCLUDED_PREFLIGHT_RUN: '30710824158'
    steps:
      - name: Find the Build 15 release retry
        id: find
        shell: bash
        run: |
          set -euo pipefail
          run_id=''
          for attempt in $(seq 1 120); do
            run_id=$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/ios-build15-testflight.yml/runs?branch=fix%2Fbuild-15-piano-premium-boundary&event=push&per_page=10" --jq '.workflow_runs | map(select(.id != 30710824158)) | sort_by(.created_at) | reverse | .[0].id // empty')
            if [ -n "$run_id" ]; then break; fi
            sleep 10
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          status=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status')
          gh pr comment 46 --repo "$GITHUB_REPOSITORY" --body "Build 15 retry monitor: release run \`$run_id\` found with status \`$status\`. The excluded run \`$EXCLUDED_PREFLIGHT_RUN\` stopped before Expo/EAS and spent no build credit. This monitor is read-only."

      - name: Wait for terminal workflow status
        shell: bash
        run: |
          set -euo pipefail
          run_id='${{ steps.find.outputs.run_id }}'
          status=''
          conclusion=''
          for attempt in $(seq 1 720); do
            status=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status')
            conclusion=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.conclusion // empty')
            if [ "$status" = 'completed' ]; then break; fi
            sleep 15
          done
          test "$status" = 'completed'
          gh pr comment 46 --repo "$GITHUB_REPOSITORY" --body "Build 15 retry monitor terminal result: run \`$run_id\` completed with conclusion \`$conclusion\`. Apple/TestFlight availability is verified separately by Apple's email."
          test "$conclusion" = 'success'
