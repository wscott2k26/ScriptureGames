name: Monitor Build 15 TestFlight

on:
  push:
    branches:
      - monitor/build15-testflight-status
    paths:
      - '.github/status-triggers/monitor-build15-testflight.md'

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Find the single Build 15 release run
        id: find
        shell: bash
        run: |
          set -euo pipefail
          run_id=''
          for attempt in $(seq 1 60); do
            run_id=$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/ios-build15-testflight.yml/runs?branch=fix%2Fbuild-15-piano-premium-boundary&event=push&per_page=10" --jq '.workflow_runs | sort_by(.created_at) | reverse | .[0].id // empty')
            if [ -n "$run_id" ]; then break; fi
            sleep 10
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          status=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status')
          gh pr comment 46 --repo "$GITHUB_REPOSITORY" --body "Build 15 release monitor: exactly one authorized iOS/TestFlight workflow was found — run \`$run_id\`, current status \`$status\`. This monitor is read-only and cannot build or submit anything."

      - name: Wait for terminal workflow status
        id: terminal
        shell: bash
        run: |
          set -euo pipefail
          run_id='${{ steps.find.outputs.run_id }}'
          status=''
          conclusion=''
          for attempt in $(seq 1 720); do
            status=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status')
            conclusion=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.conclusion // empty')
            if [ "$status" = 'completed' ]; then break; fi
            sleep 15
          done
          test "$status" = 'completed'
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          gh pr comment 46 --repo "$GITHUB_REPOSITORY" --body "Build 15 release monitor terminal result: run \`$run_id\` completed with conclusion \`$conclusion\`. This reports the GitHub release workflow only; Apple availability is confirmed separately by TestFlight email."
          test "$conclusion" = 'success'
