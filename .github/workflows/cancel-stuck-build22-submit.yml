name: Cancel Stalled Build 22 Submit Runner

on:
  push:
    branches:
      - release/build22-testflight-submit
    paths:
      - '.github/status-triggers/cancel-stuck-build22-submit.md'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_RUN_ID: '31073588402'
      TARGET_JOB_ID: '92526520212'
    steps:
      - name: Verify exact stalled pre-upload run
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "release/build22-testflight-submit"
          expected=$'CANCEL_EXACT_STALLED_RUN=31073588402\nTARGET_JOB=92526520212\nREASON=SETUP_NODE_CACHE_STALL_BEFORE_EAS_OR_APPLE\nNO_SUBMISSION_OCCURRED=TRUE\nNO_RETRY_IN_THIS_WORKFLOW=TRUE'
          test "$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/.github/status-triggers/cancel-stuck-build22-submit.md")" = "$expected"

          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$TARGET_JOB_ID" > /tmp/job.json
          jq -e '
            .run_id == (env.TARGET_RUN_ID | tonumber) and
            .status == "in_progress" and
            ([.steps[] | select(.name == "Set up Node" and .status == "in_progress")] | length == 1) and
            ([.steps[] | select(.name == "Submit exact existing Build 22 to TestFlight" and .status != "pending")] | length == 0)
          ' /tmp/job.json

      - name: Cancel exact stalled workflow run
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID/cancel"

          for attempt in $(seq 1 30); do
            status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID" --jq '.status')
            conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID" --jq '.conclusion // ""')
            echo "target status=$status conclusion=$conclusion"
            if [ "$status" = "completed" ] && [ "$conclusion" = "cancelled" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Target run did not reach cancelled state." >&2
          exit 1
