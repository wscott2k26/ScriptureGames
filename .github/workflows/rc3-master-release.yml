name: RC3 Master Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rc3-master-release.yml'

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: scripture-games-rc3-master-release
  cancel-in-progress: false

env:
  RC3_SOURCE_BRANCH: rc3-upload
  RC3_ZIP: ScriptureGames-Cinematic-Visual-Master-RC3.zip
  RC3_SHA256: 0ac177ef5ff9b408a140ffb623295ae00c09171c366e587706d0b6d81c5592b2
  EAS_PROJECT_ID: 18710e80-2a62-46ac-8d3a-d1711b7d920a
  EAS_OWNER: wscott2k8

jobs:
  certify-and-publish-source:
    name: Certify RC3 four times and publish source
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out canonical main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check out the uploaded RC3 package
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RC3_SOURCE_BRANCH }}
          path: rc3-upload-source
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify the exact uploaded ZIP and extract it safely
        shell: bash
        run: |
          set -euo pipefail
          zip_path="$GITHUB_WORKSPACE/rc3-upload-source/$RC3_ZIP"
          test -f "$zip_path"
          printf '%s  %s\n' "$RC3_SHA256" "$zip_path" | sha256sum --check --strict

          rm -rf /tmp/scripture-games-rc3
          mkdir -p /tmp/scripture-games-rc3
          unzip -q "$zip_path" -d /tmp/scripture-games-rc3

          source_root="/tmp/scripture-games-rc3/ScriptureGames-Cinematic-Visual-Master-RC3"
          test -f "$source_root/frontend/package.json"
          test -f "$source_root/frontend/app.json"
          test -f "$source_root/frontend/eas.json"
          test -f "$source_root/scripts/audit.py"
          test -f "$source_root/scripts/audit-visual-master.py"
          test -f "$source_root/scripts/generate-rc3-assets.py"
          echo "SOURCE_ROOT=$source_root" >> "$GITHUB_ENV"

      - name: Correct and lock the connected Expo identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['SOURCE_ROOT'])
          app_path = root / 'frontend' / 'app.json'
          app = json.loads(app_path.read_text(encoding='utf-8'))
          expo = app['expo']
          expo['owner'] = os.environ['EAS_OWNER']
          expo.setdefault('extra', {}).setdefault('eas', {})['projectId'] = os.environ['EAS_PROJECT_ID']
          app_path.write_text(json.dumps(app, indent=2) + '\n', encoding='utf-8')

          audit_path = root / 'scripts' / 'audit.py'
          audit = audit_path.read_text(encoding='utf-8')
          audit = audit.replace(
              'check(app_config.get("owner") == "wscott2k26", "Expo owner matches the canonical account")',
              'check(app_config.get("owner") == "wscott2k8", "Expo owner matches the connected EAS account")',
          )
          audit_path.write_text(audit, encoding='utf-8')
          PY

      - name: Install registry-backed dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow==11.3.0
          npm install --global yarn@1.22.22
          cd "$SOURCE_ROOT/frontend"
          yarn install --non-interactive --network-timeout 600000

      - name: Verify deterministic RC3 artwork
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          find frontend/assets -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/assets-before.sha256
          python scripts/generate-rc3-assets.py
          find frontend/assets -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/assets-after.sha256
          diff -u /tmp/assets-before.sha256 /tmp/assets-after.sha256

      - name: Run four complete certification passes
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          for pass in 1 2 3 4; do
            echo "========== RC3 MASTER PASS $pass OF 4 =========="
            python scripts/audit.py
            python scripts/audit-visual-master.py
            (
              cd frontend
              yarn doctor
              yarn typecheck
              yarn lint
              rm -rf dist-ios dist-android .expo
              yarn export:ios
              yarn export:android
              test -d dist-ios
              test -d dist-android
              rm -rf dist-ios dist-android .expo
            )
          done

      - name: Generate a fresh source manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path(os.environ['SOURCE_ROOT'])
          ignored_parts = {'.git', '.github', 'node_modules', '.expo', 'dist-ios', 'dist-android'}
          files = {}
          for path in sorted(root.rglob('*')):
              if not path.is_file() or 'BUILD_MANIFEST.json' == path.name:
                  continue
              rel = path.relative_to(root)
              if any(part in ignored_parts for part in rel.parts):
                  continue
              data = path.read_bytes()
              files[str(rel).replace('\\', '/')] = {
                  'size': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              }
          manifest = {
              'generatedAt': datetime.now(timezone.utc).isoformat(),
              'sourceZipSha256': os.environ['RC3_SHA256'],
              'files': files,
          }
          (root / 'BUILD_MANIFEST.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Publish the certified normal source tree to main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SOURCE_ROOT/frontend/node_modules" "$SOURCE_ROOT/frontend/.expo" "$SOURCE_ROOT/frontend/dist-ios" "$SOURCE_ROOT/frontend/dist-android"

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'rc3-upload-source' \
            -exec rm -rf {} +

          rsync -a --exclude='.github/' "$SOURCE_ROOT/" ./
          rm -rf rc3-upload-source ci-payload payload release-patches

          git config user.email actions@users.noreply.github.com
          git config user.name 'Scripture Games CI'
          git add -A
          git commit -m 'Publish four-pass certified RC3 cinematic source'
          git push origin HEAD:main

      - name: Open a diagnostic issue if certification fails
        if: failure()
        shell: bash
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "RC3 certification failed — run $GITHUB_RUN_ID" \
            --body "The four-pass RC3 certification or source publication failed. Review the workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  signed-builds-and-testflight-submit:
    name: Build Android preview and submit iOS to TestFlight
    needs: certify-and-publish-source
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out certified main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Set up connected Expo and EAS identity
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install certified dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global yarn@1.22.22
          cd frontend
          yarn install --frozen-lockfile --non-interactive --network-timeout 600000

      - name: Quadruple-check Expo identity and app identifiers
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          for pass in 1 2 3 4; do
            echo "========== EXPO IDENTITY PASS $pass OF 4 =========="
            eas whoami | tee "/tmp/eas-whoami-$pass.txt"
            grep -q "$EAS_OWNER" "/tmp/eas-whoami-$pass.txt"
            eas project:info --non-interactive | tee "/tmp/eas-project-$pass.txt"
            grep -q "$EAS_PROJECT_ID" "/tmp/eas-project-$pass.txt"
            npx expo config --json > "/tmp/expo-config-$pass.json"
            python - "/tmp/expo-config-$pass.json" <<'PY'
          import json
          import os
          import sys
          cfg = json.load(open(sys.argv[1], encoding='utf-8'))
          assert cfg['owner'] == os.environ['EAS_OWNER']
          assert cfg['extra']['eas']['projectId'] == os.environ['EAS_PROJECT_ID']
          assert cfg['ios']['bundleIdentifier'] == 'com.willywill.scripturegames'
          assert cfg['android']['package'] == 'com.willywill.scripturegames'
          PY
          done

      - name: Build Android preview APK
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --json > ../android-build.json
          python -m json.tool ../android-build.json

      - name: Build signed iOS production binary
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          eas build \
            --platform ios \
            --profile production \
            --non-interactive \
            --json > ../ios-build.json
          python -m json.tool ../ios-build.json

      - name: Submit the signed iOS build to App Store Connect
        shell: bash
        run: |
          set -euo pipefail
          ios_build_id="$(python - <<'PY'
          import json
          data = json.load(open('ios-build.json', encoding='utf-8'))
          if isinstance(data, list):
              data = data[0]
          print(data['id'])
          PY
          )"
          test -n "$ios_build_id"
          cd frontend
          eas submit \
            --platform ios \
            --profile production \
            --id "$ios_build_id" \
            --non-interactive
          printf '%s\n' "$ios_build_id" > ../ios-build-id.txt

      - name: Upload signed-build records
        uses: actions/upload-artifact@v4
        with:
          name: scripture-games-rc3-signed-build-records
          path: |
            android-build.json
            ios-build.json
            ios-build-id.txt
          if-no-files-found: error
          retention-days: 90

      - name: Record successful release status on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          cat > RELEASE_PIPELINE_STATUS.md <<EOF
          # Scripture Games RC3 Release Pipeline Status

          Generated: $(date -u +'%Y-%m-%d %H:%M:%S UTC')

          - Exact uploaded RC3 ZIP checksum: verified
          - Four full certification passes: passed
          - Certified source published to main: passed
          - Android preview APK build: completed
          - Signed iOS production build: completed
          - App Store Connect submission: completed
          - TestFlight processing/group availability: awaiting Apple processing confirmation

          GitHub Actions run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
          git config user.email actions@users.noreply.github.com
          git config user.name 'Scripture Games CI'
          git add RELEASE_PIPELINE_STATUS.md
          git commit -m 'Record successful RC3 build and TestFlight submission'
          git push origin HEAD:main

      - name: Open a diagnostic issue if signed builds or submission fail
        if: failure()
        shell: bash
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "RC3 signed build or TestFlight submission failed — run $GITHUB_RUN_ID" \
            --body "The certified source passed, but a signed build or App Store Connect submission step failed. Review: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
