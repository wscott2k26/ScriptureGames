name: Scripture Games iOS Build 20 Only

on:
  push:
    branches:
      - release/build20-ios-only
    paths:
      - '.github/status-triggers/ios-build20-authorized.md'

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: scripture-games-ios-build20-only
  cancel-in-progress: false

jobs:
  build:
    name: Build 20 iOS production without submission
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      VERIFIED_SOURCE_SHA: 6d02cccfbd6bb91f6b85893302644b9d80980e96

    steps:
      - name: Check out exact Build 20 release branch
        uses: actions/checkout@v4
        with:
          ref: release/build20-ios-only
          fetch-depth: 0

      - name: Verify one-use authorization and source boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "release/build20-ios-only"
          test -f .github/status-triggers/ios-build20-authorized.md
          grep -Fq 'AUTHORIZED: one iOS Build 20 production EAS build only.' .github/status-triggers/ios-build20-authorized.md
          grep -Fq 'NO TESTFLIGHT OR APP STORE CONNECT SUBMISSION.' .github/status-triggers/ios-build20-authorized.md
          grep -Fq 'NO ANDROID CLOUD BUILD.' .github/status-triggers/ios-build20-authorized.md
          grep -Fq 'NO APP REVIEW OR PUBLIC RELEASE.' .github/status-triggers/ios-build20-authorized.md
          git merge-base --is-ancestor "$VERIFIED_SOURCE_SHA" HEAD
          git diff --exit-code "$VERIFIED_SOURCE_SHA" HEAD -- frontend scripts supabase
          run_count=$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/ios-build20-only.yml/runs?branch=release%2Fbuild20-ios-only&event=push&per_page=20" --jq '.workflow_runs | length')
          test "$run_count" -eq 1
          echo "Verified Build 20 application source $VERIFIED_SOURCE_SHA is unchanged."

      - name: Verify protected Expo credential exists
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir Pillow==11.3.0
          npm install --global yarn@1.22.22
          cd frontend
          yarn install --frozen-lockfile --non-interactive --network-timeout 600000

      - name: Run complete source gate again
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          yarn validate

      - name: Verify Expo identity and linked project
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          eas whoami | tee /tmp/eas-whoami.txt
          grep -Eq '^wscott2k8([[:space:]]|$)' /tmp/eas-whoami.txt
          eas project:info --non-interactive
          npx expo config --type public > /tmp/expo-public-config.txt
          grep -q '18710e80-2a62-46ac-8d3a-d1711b7d920a' /tmp/expo-public-config.txt
          grep -q 'com.willywill.scripturegames' /tmp/expo-public-config.txt

      - name: Build exactly one iOS production binary without submitting
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          eas build \
            --platform ios \
            --profile production \
            --non-interactive \
            --json > ../ios-build20-only.json
          python -m json.tool ../ios-build20-only.json

      - name: Validate exact Build 20 record and zero submissions
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            length == 1 and
            .[0].platform == "IOS" and
            .[0].project.id == "18710e80-2a62-46ac-8d3a-d1711b7d920a" and
            .[0].distribution == "STORE" and
            .[0].buildProfile == "production" and
            .[0].appVersion == "1.0.0" and
            .[0].appBuildVersion == "20" and
            .[0].isForIosSimulator == false and
            .[0].gitCommitHash == env.GITHUB_SHA and
            ((.[0].submissions // []) | length == 0)
          ' ios-build20-only.json

      - name: Save unsigned-submission-boundary build record
        uses: actions/upload-artifact@v4
        with:
          name: scripture-games-ios-build20-build-only-record
          path: ios-build20-only.json
          if-no-files-found: error
          retention-days: 90

      - name: Report Build 20 blocker without retrying
        if: failure()
        shell: bash
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Build 20 iOS-only launcher stopped" --body "The single authorized Build 20 build-only workflow stopped in run $GITHUB_RUN_ID. No retry, second EAS build, TestFlight upload, Android build, or public release is authorized automatically."
