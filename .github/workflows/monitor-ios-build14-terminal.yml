name: Monitor Existing Scripture Games iOS Build 14

on:
  push:
    branches:
      - fix/build-14-global-audio-backgrounds
    paths:
      - '.github/status-triggers/monitor-ios-build14-terminal.md'

permissions:
  contents: write

concurrency:
  group: scripture-games-ios-build14-terminal-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      BUILD_ID: 26600417-f294-426c-ac8e-a373cc0ceccf
      SUBMISSION_ID: 68929a84-8c8d-46f6-907e-426e40674ce1
      BRANCH_NAME: fix/build-14-global-audio-backgrounds

    steps:
      - name: Verify Expo credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}"

      - uses: actions/checkout@v4
        with:
          ref: fix/build-14-global-audio-backgrounds
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Poll the existing build and submission only
        shell: bash
        run: |
          set -euo pipefail
          export FINAL_RESULT='monitor-timeout'
          export TERMINAL='0'

          for attempt in $(seq 1 160); do
            cd frontend
            eas build:view "$BUILD_ID" --json > ../ios-build14-live.json
            cd ..

            build_status=$(jq -r 'if type == "array" then .[0].status else .status end' ios-build14-live.json)
            submission_id=$(jq -r 'if type == "array" then (.[0].submissions[0].id // "NONE") else (.submissions[0].id // "NONE") end' ios-build14-live.json)
            submission_status=$(jq -r 'if type == "array" then (.[0].submissions[0].status // "NONE") else (.submissions[0].status // "NONE") end' ios-build14-live.json)

            test "$submission_id" = "$SUBMISSION_ID"
            echo "Attempt $attempt: build=$build_status submission=$submission_status"

            case "$build_status" in
              ERRORED|CANCELED)
                export TERMINAL='1'
                export FINAL_RESULT="build-$build_status"
                break
                ;;
              FINISHED)
                case "$submission_status" in
                  FINISHED)
                    export TERMINAL='1'
                    export FINAL_RESULT='build-and-submission-finished'
                    break
                    ;;
                  ERRORED|CANCELED)
                    export TERMINAL='1'
                    export FINAL_RESULT="submission-$submission_status"
                    break
                    ;;
                esac
                ;;
            esac
            sleep 15
          done

          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          payload = json.loads(Path('ios-build14-live.json').read_text())
          build = payload[0] if isinstance(payload, list) else payload
          submissions = build.get('submissions') or []
          submission = submissions[0] if submissions else {}
          result = {
              'recorded_at': datetime.now(timezone.utc).isoformat(),
              'result': os.environ.get('FINAL_RESULT'),
              'terminal': os.environ.get('TERMINAL') == '1',
              'build_id': build.get('id'),
              'build_status': build.get('status'),
              'app_version': build.get('appVersion'),
              'build_number': build.get('appBuildVersion'),
              'platform': build.get('platform'),
              'distribution': build.get('distribution'),
              'build_profile': build.get('buildProfile'),
              'git_commit_hash': build.get('gitCommitHash'),
              'created_at': build.get('createdAt'),
              'updated_at': build.get('updatedAt'),
              'submission_id': submission.get('id'),
              'submission_status': submission.get('status'),
              'asc_app_id': (submission.get('iosConfig') or {}).get('ascAppIdentifier'),
          }
          Path('BUILD_14_LIVE_STATUS.json').write_text(json.dumps(result, indent=2) + '\n')
          Path('BUILD_14_LIVE_STATUS.md').write_text(
              '# Scripture Games Build 14 Live Status\n\n'
              f"- Recorded: `{result['recorded_at']}`\n"
              f"- Result: `{result['result']}`\n"
              f"- EAS build ID: `{result['build_id']}`\n"
              f"- Build status: `{result['build_status']}`\n"
              f"- Version/build: `{result['app_version']} ({result['build_number']})`\n"
              f"- Submission ID: `{result['submission_id']}`\n"
              f"- Submission status: `{result['submission_status']}`\n"
          )
          print(json.dumps(result, indent=2))
          PY

          test "$TERMINAL" = '1'
          test "$FINAL_RESULT" = 'build-and-submission-finished'

      - name: Commit terminal status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin "$BRANCH_NAME"
          git add BUILD_14_LIVE_STATUS.json BUILD_14_LIVE_STATUS.md
          git commit -m 'release: record terminal iOS Build 14 status'
          git push origin HEAD:"$BRANCH_NAME"
