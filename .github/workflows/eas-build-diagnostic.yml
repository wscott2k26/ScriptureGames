name: EAS Build Diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/release-triggers/eas-build-diagnostic.md'

permissions:
  contents: read

jobs:
  inspect-existing-build:
    name: Inspect exact EAS iOS build without rebuilding
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check out certified main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}

      - name: Install project dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global yarn@1.22.22
          cd frontend
          yarn install --frozen-lockfile --non-interactive --network-timeout 600000

      - name: Inspect exact iOS build and submission linkage
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          eas build:view 20647cd0-2f76-4cb7-930f-22db46103be1 --json > ../eas-build-diagnostic.json
          cd ..
          cat eas-build-diagnostic.json

      - name: Upload diagnostic record
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scripture-games-eas-build-diagnostic
          path: eas-build-diagnostic.json
          if-no-files-found: warn
          retention-days: 30
