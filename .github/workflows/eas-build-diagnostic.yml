name: EAS Build Diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/release-triggers/eas-build-diagnostic.md'

permissions:
  contents: read

jobs:
  inspect-existing-build:
    name: Inspect exact EAS iOS submission without rebuilding
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Query Expo submission record
        shell: bash
        run: |
          set -euo pipefail
          QUERY='query SubmissionStatus($id: ID!) { submissions { byId(submissionId: $id) { id status platform createdAt updatedAt completedAt logFiles iosConfig { ascAppIdentifier } submittedBuild { id status appBuildVersion } } } }'
          jq -n --arg query "$QUERY" --arg id '73b9722e-ee5d-4f9d-8931-c14273663b5e' '{query:$query,variables:{id:$id}}' > expo-submission-query.json
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${EXPO_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data @expo-submission-query.json \
            https://api.expo.dev/graphql \
            > eas-submission-diagnostic.json
          jq . eas-submission-diagnostic.json
          if jq -e '.errors and (.errors | length > 0)' eas-submission-diagnostic.json >/dev/null; then
            exit 1
          fi

      - name: Upload diagnostic record
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scripture-games-eas-submission-diagnostic
          path: eas-submission-diagnostic.json
          if-no-files-found: warn
          retention-days: 30
