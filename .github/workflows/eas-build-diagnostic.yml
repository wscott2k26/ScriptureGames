name: EAS Build Diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/release-triggers/eas-build-diagnostic.md'

permissions:
  contents: read

jobs:
  inspect-existing-build:
    name: Inspect latest EAS iOS build without rebuilding
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check out certified main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}

      - name: Install project dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global yarn@1.22.22
          cd frontend
          yarn install --frozen-lockfile --non-interactive --network-timeout 600000

      - name: Inspect latest iOS build and capture live log
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          eas build:list --platform ios --limit 5 --json --non-interactive > ../eas-build-list.json
          cd ..
          node -e "const fs=require('fs');let r=JSON.parse(fs.readFileSync('eas-build-list.json','utf8'));if(!Array.isArray(r))r=r.builds||r.data||[];if(!r.length)throw new Error('No iOS build records returned');const b=r[0];fs.writeFileSync('eas-build-diagnostic.json',JSON.stringify(b,null,2));fs.writeFileSync('eas-remote-log-url.txt',(b.logFiles||[])[0]||'');console.log(JSON.stringify(b,null,2));"
          if [ -s eas-remote-log-url.txt ]; then
            curl --fail --location --retry 3 --retry-all-errors --output eas-remote-build.raw "$(cat eas-remote-log-url.txt)"
          fi

      - name: Upload diagnostic record
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scripture-games-eas-build-diagnostic
          path: |
            eas-build-list.json
            eas-build-diagnostic.json
            eas-remote-build.raw
          if-no-files-found: warn
          retention-days: 30
