name: EAS Build Diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/release-triggers/eas-build-diagnostic.md'

permissions:
  contents: read

jobs:
  inspect-existing-build:
    name: Inspect latest EAS Android build without rebuilding
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check out certified main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}

      - name: Install project dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global yarn@1.22.22
          cd frontend
          yarn install --frozen-lockfile --non-interactive --network-timeout 600000

      - name: Inspect latest Android build and live phase log
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          eas build:list --platform android --limit 5 --json --non-interactive > ../eas-build-list.json
          cd ..
          node <<'NODE'
          const fs = require('fs');
          let records = JSON.parse(fs.readFileSync('eas-build-list.json', 'utf8'));
          if (!Array.isArray(records)) records = records.builds || records.data || [];
          if (!records.length) throw new Error('No Android build records returned');
          const build = records[0];
          fs.writeFileSync('eas-build-diagnostic.json', JSON.stringify(build, null, 2));
          fs.writeFileSync('eas-remote-log-url.txt', (build.logFiles || [])[0] || '');
          console.log(JSON.stringify(build, null, 2));
          NODE
          if [ -s eas-remote-log-url.txt ]; then
            curl --fail --location --retry 3 --retry-all-errors \
              --output eas-remote-build.raw \
              "$(cat eas-remote-log-url.txt)"
            node <<'NODE'
            const fs = require('fs');
            const zlib = require('zlib');
            const raw = fs.readFileSync('eas-remote-build.raw');
            let text;
            try {
              text = zlib.brotliDecompressSync(raw).toString('utf8');
            } catch {
              text = raw.toString('utf8');
            }
            fs.writeFileSync('eas-remote-build.log', text);
            const lines = text.split(/\r?\n/);
            console.log('--- LIVE EAS BUILD TAIL ---');
            console.log(lines.slice(-220).join('\n'));
            NODE
          fi

      - name: Upload diagnostic record
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scripture-games-eas-build-diagnostic
          path: |
            eas-build-list.json
            eas-build-diagnostic.json
            eas-remote-build.log
          if-no-files-found: warn
          retention-days: 30
