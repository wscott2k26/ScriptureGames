name: Apply Build 14 Global Scene Cleanup

on:
  push:
    branches:
      - fix/build-14-global-audio-backgrounds
    paths:
      - '.github/status-triggers/apply-build14-global-scene.md'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/build-14-global-audio-backgrounds
          fetch-depth: 0

      - name: Remove fixed non-gameplay scene overrides
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          app = Path('frontend/app')
          matches = []
          for path in app.rglob('*.tsx'):
              text = path.read_text()
              if 'sceneId=' in text:
                  matches.append((path.as_posix(), text.count('sceneId=')))

          expected = [('frontend/app/tutorial.tsx', 1)]
          if matches != expected:
              raise SystemExit(f'Unexpected fixed scene overrides: {matches!r}; expected only {expected!r}')

          path = Path('frontend/app/tutorial.tsx')
          text = path.read_text()
          old = '<PeacefulBackdrop sceneId="cross-on-the-hill" darkness={0.54}>'
          new = '<PeacefulBackdrop darkness={0.54}>'
          if text.count(old) != 1:
              raise SystemExit('Tutorial fixed-scene marker changed; refusing to guess.')
          path.write_text(text.replace(old, new))

          leftovers = []
          for candidate in app.rglob('*.tsx'):
              if 'sceneId=' in candidate.read_text():
                  leftovers.append(candidate.as_posix())
          if leftovers:
              raise SystemExit(f'Fixed app scene overrides remain: {leftovers}')
          PY

      - name: Commit guarded scene cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/app/tutorial.tsx
          git commit -m 'fix: keep tutorial on the selected global background'
          git push origin HEAD:fix/build-14-global-audio-backgrounds
