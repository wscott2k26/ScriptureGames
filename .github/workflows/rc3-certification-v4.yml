name: RC3 Certification V4

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: scripture-games-rc3-v4
  cancel-in-progress: false

env:
  RC3_SOURCE_BRANCH: rc3-upload
  RC3_ZIP: ScriptureGames-Cinematic-Visual-Master-RC3.zip
  RC3_SHA256: 0ac177ef5ff9b408a140ffb623295ae00c09171c366e587706d0b6d81c5592b2
  EAS_PROJECT_ID: 18710e80-2a62-46ac-8d3a-d1711b7d920a
  EAS_OWNER: wscott2k8

jobs:
  certify-and-publish:
    name: Four-pass certification and source publication
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check out uploaded RC3 ZIP
        uses: actions/checkout@v4
        with:
          ref: rc3-upload
          path: rc3-upload-source
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify and prepare exact RC3 source
        shell: bash
        run: |
          set -euo pipefail
          zip_path="$GITHUB_WORKSPACE/rc3-upload-source/$RC3_ZIP"
          test -f "$zip_path"
          printf '%s  %s\n' "$RC3_SHA256" "$zip_path" | sha256sum --check --strict
          rm -rf /tmp/sg-rc3
          mkdir -p /tmp/sg-rc3
          unzip -q "$zip_path" -d /tmp/sg-rc3
          source_root="/tmp/sg-rc3/ScriptureGames-Cinematic-Visual-Master-RC3"
          test -f "$source_root/frontend/package.json"
          test -f "$source_root/scripts/audit.py"
          EAS_PROJECT_ID="$EAS_PROJECT_ID" EAS_OWNER="$EAS_OWNER" python .github/scripts/prepare_rc3.py "$source_root"
          echo "SOURCE_ROOT=$source_root" >> "$GITHUB_ENV"

      - name: Install real dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow==11.3.0
          npm install --global yarn@1.22.22
          cd "$SOURCE_ROOT/frontend"
          yarn install --non-interactive --network-timeout 600000

      - name: Verify deterministic artwork
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          find frontend/assets -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/assets-before
          python scripts/generate-rc3-assets.py
          find frontend/assets -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/assets-after
          diff -u /tmp/assets-before /tmp/assets-after

      - name: Run every release gate four times
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          for pass in 1 2 3 4; do
            echo "========== RC3 V4 PASS $pass OF 4 =========="
            python scripts/audit.py
            python scripts/audit-visual-master.py
            cd frontend
            yarn doctor
            yarn typecheck
            yarn lint
            rm -rf dist-ios dist-android .expo
            yarn export:ios
            yarn export:android
            test -d dist-ios
            test -d dist-android
            rm -rf dist-ios dist-android .expo
            cd ..
          done

      - name: Publish certified normal source to main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SOURCE_ROOT/frontend/node_modules" "$SOURCE_ROOT/frontend/.expo" "$SOURCE_ROOT/frontend/dist-ios" "$SOURCE_ROOT/frontend/dist-android"
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name 'rc3-upload-source' -exec rm -rf {} +
          rsync -a --exclude='.github/' "$SOURCE_ROOT/" ./
          rm -rf rc3-upload-source ci-payload payload release-patches
          git config user.email actions@users.noreply.github.com
          git config user.name 'Scripture Games CI'
          git add -A
          if git diff --cached --quiet; then
            echo 'Certified RC3 source already matches main; continuing to signed builds.'
          else
            git commit -m 'Publish four-pass certified RC3 source via V4'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Report certification blocker
        if: failure()
        shell: bash
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "RC3 V4 certification failed — run $GITHUB_RUN_ID" --body "Review: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  signed-builds:
    name: Android preview and TestFlight submission
    needs: certify-and-publish
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install certified dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global yarn@1.22.22
          cd frontend
          yarn install --frozen-lockfile --non-interactive --network-timeout 600000

      - name: Verify Expo account and project
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          eas whoami
          eas project:info --non-interactive

      - name: Build Android preview APK
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          eas build --platform android --profile preview --non-interactive --json > ../android-build.json

      - name: Build and submit iOS to TestFlight
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          eas build --platform ios --profile production --non-interactive --auto-submit --json > ../ios-build.json

      - name: Save build records
        uses: actions/upload-artifact@v4
        with:
          name: scripture-games-rc3-v4-build-records
          path: |
            android-build.json
            ios-build.json
          if-no-files-found: error
          retention-days: 90

      - name: Report signed-build blocker
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "RC3 signed builds need attention — run $GITHUB_RUN_ID" --body "Review: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
