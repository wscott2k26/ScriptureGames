name: Scripture Games Build 22 TestFlight Submit Only

on:
  push:
    branches:
      - release/build22-testflight-submit
    paths:
      - '.github/status-triggers/ios-build22-submit-authorized.md'

permissions:
  contents: read
  issues: write

concurrency:
  group: scripture-games-build22-testflight-submit-only
  cancel-in-progress: false

jobs:
  submit:
    name: Submit exact verified Build 22 to TestFlight
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      BUILD_ID: 4529cc1d-65db-4387-938e-fa5d91814df8
      BUILD_SOURCE_SHA: f16acf2ebd843e4c189b8f20f6302dc382e84aa3
      EAS_PROJECT_ID: 18710e80-2a62-46ac-8d3a-d1711b7d920a
      ASC_APP_ID: '6795368257'
      BUNDLE_ID: com.willywill.scripturegames
      APP_VERSION: 1.0.0
      BUILD_NUMBER: '22'

    steps:
      - name: Check out isolated submit-only branch
        uses: actions/checkout@v4
        with:
          ref: release/build22-testflight-submit
          fetch-depth: 0

      - name: Enforce exact one-submission boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "release/build22-testflight-submit"
          test -n "${EXPO_TOKEN:-}"

          expected_trigger=$'AUTHORIZED: submit exact existing iOS Build 22 to TestFlight.\nBUILD_ID=4529cc1d-65db-4387-938e-fa5d91814df8\nSOURCE_SHA=f16acf2ebd843e4c189b8f20f6302dc382e84aa3\nNO NEW EAS BUILD.\nNO ANDROID BUILD.\nNO APP REVIEW OR PUBLIC RELEASE.\nNO AUTOMATIC RETRY.'
          test "$(cat .github/status-triggers/ios-build22-submit-authorized.md)" = "$expected_trigger"

          git fetch origin main --depth=1
          test "$(git rev-parse origin/main)" = "$BUILD_SOURCE_SHA"
          git merge-base --is-ancestor "$BUILD_SOURCE_SHA" HEAD
          git diff --exit-code "$BUILD_SOURCE_SHA" HEAD -- frontend backend scripts supabase support-site

          mapfile -t changed < <(git diff --name-only "$BUILD_SOURCE_SHA"..HEAD | sort)
          printf '%s\n' "${changed[@]}" > /tmp/changed-files.txt
          cat > /tmp/expected-files.txt <<'FILES'
          .github/status-triggers/ios-build22-submit-authorized.md
          .github/workflows/ios-build22-submit-only.yml
          FILES
          diff -u /tmp/expected-files.txt /tmp/changed-files.txt

          test "$(grep -Ec '^[[:space:]]+eas submit --platform ios --profile production --id ' .github/workflows/ios-build22-submit-only.yml)" = "1"
          test "$(grep -Ec '^[[:space:]]+eas build ' .github/workflows/ios-build22-submit-only.yml || true)" = "0"
          test "$(grep -Ec '^[[:space:]]+eas submit .*--platform android' .github/workflows/ios-build22-submit-only.yml || true)" = "0"
          test "$(grep -Ec '^[[:space:]]+eas submit .*--auto-submit' .github/workflows/ios-build22-submit-only.yml || true)" = "0"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Authenticate Expo with pinned EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: 16.20.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install frozen app dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          yarn install --frozen-lockfile --non-interactive --network-timeout 600000

      - name: Verify Expo identity, submit profile, and exact unsubmitted Build 22
        shell: bash
        run: |
          set -euo pipefail
          cd frontend

          eas whoami | tee /tmp/eas-whoami.txt
          grep -Eq '^wscott2k8([[:space:]]|$)' /tmp/eas-whoami.txt

          eas project:info --non-interactive | tee /tmp/eas-project.txt
          grep -q "$EAS_PROJECT_ID" /tmp/eas-project.txt

          jq -e --arg asc "$ASC_APP_ID" '.submit.production.ios.ascAppId == $asc' eas.json
          eas submit --help > /tmp/eas-submit-help.txt
          grep -Fq -- '--platform' /tmp/eas-submit-help.txt
          grep -Fq -- '--profile' /tmp/eas-submit-help.txt
          grep -Fq -- '--id' /tmp/eas-submit-help.txt
          grep -Fq -- '--non-interactive' /tmp/eas-submit-help.txt

          eas build:view "$BUILD_ID" --json > /tmp/build22-before.json
          jq -e '
            .id == env.BUILD_ID and
            .status == "FINISHED" and
            .platform == "IOS" and
            .project.id == env.EAS_PROJECT_ID and
            .distribution == "STORE" and
            .buildProfile == "production" and
            .appVersion == env.APP_VERSION and
            .appBuildVersion == env.BUILD_NUMBER and
            .isForIosSimulator == false and
            .gitCommitHash == env.BUILD_SOURCE_SHA and
            (.artifacts.buildUrl | type == "string" and length > 0) and
            (.submission == null) and
            (((.submissions // []) | length) == 0)
          ' /tmp/build22-before.json

          echo "Exact signed Build 22 verified and has no prior EAS submission."

      - name: Submit exact existing Build 22 to TestFlight
        id: submit
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          eas submit --platform ios --profile production --id "$BUILD_ID" --non-interactive | tee ../ios-build22-submit.log
          cd ..

          grep -Fq 'Your binary has been successfully uploaded to App Store Connect!' ios-build22-submit.log
          submission_id=$(grep -Eo 'submissions/[0-9a-f-]+' ios-build22-submit.log | tail -1 | cut -d/ -f2)
          test -n "$submission_id"
          echo "submission_id=$submission_id" >> "$GITHUB_OUTPUT"

          node <<'NODE'
          const fs = require('fs');
          const record = {
            buildId: process.env.BUILD_ID,
            buildNumber: process.env.BUILD_NUMBER,
            appVersion: process.env.APP_VERSION,
            sourceSha: process.env.BUILD_SOURCE_SHA,
            projectId: process.env.EAS_PROJECT_ID,
            ascAppId: process.env.ASC_APP_ID,
            bundleId: process.env.BUNDLE_ID,
            submissionId: process.env.SUBMISSION_ID,
            appleUploadAcknowledged: true,
            appReviewSubmitted: false,
            publicReleaseRequested: false,
            androidBuildRequested: false,
            recordedAt: new Date().toISOString(),
          };
          fs.writeFileSync('ios-build22-submission-record.json', JSON.stringify(record, null, 2));
          NODE
        env:
          SUBMISSION_ID: ${{ steps.submit.outputs.submission_id }}

      - name: Verify submission record
        shell: bash
        env:
          SUBMISSION_ID: ${{ steps.submit.outputs.submission_id }}
        run: |
          set -euo pipefail
          test -n "$SUBMISSION_ID"
          test -f ios-build22-submit.log
          test -f ios-build22-submission-record.json
          jq -e '
            .buildId == env.BUILD_ID and
            .buildNumber == env.BUILD_NUMBER and
            .appVersion == env.APP_VERSION and
            .sourceSha == env.BUILD_SOURCE_SHA and
            .submissionId == env.SUBMISSION_ID and
            .appleUploadAcknowledged == true and
            .appReviewSubmitted == false and
            .publicReleaseRequested == false and
            .androidBuildRequested == false
          ' ios-build22-submission-record.json

      - name: Preserve Build 22 TestFlight submission evidence
        uses: actions/upload-artifact@v4
        with:
          name: scripture-games-build22-testflight-submission
          path: |
            ios-build22-submit.log
            ios-build22-submission-record.json
            /tmp/build22-before.json
          if-no-files-found: error
          retention-days: 90

      - name: Report successful Build 22 upload
        shell: bash
        env:
          SUBMISSION_ID: ${{ steps.submit.outputs.submission_id }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Build 22 uploaded to TestFlight" \
            --body "Apple acknowledged the upload of exact existing iOS Build 22. EAS build ID: $BUILD_ID. EAS submission ID: $SUBMISSION_ID. App version: $APP_VERSION ($BUILD_NUMBER). Source: $BUILD_SOURCE_SHA. No new EAS build, Android build, App Review submission, or public release occurred. Apple processing may still be underway. Workflow run: $GITHUB_RUN_ID."

      - name: Report blocker without retrying
        if: failure()
        shell: bash
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Build 22 TestFlight submission stopped — no retry authorized" \
            --body "The submission-only workflow stopped in run $GITHUB_RUN_ID. Target EAS build ID: $BUILD_ID. This workflow contains no EAS build command, Android build, App Review submission, or public release. No automatic retry is authorized."
