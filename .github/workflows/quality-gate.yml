name: Scripture Games Quality Gate

on:
  pull_request:
    branches:
      - main
      - feature/complete-bible-journey-upgrade
      - fix/build-13-acceptance-regressions
      - fix/build-14-global-audio-backgrounds
      - fix/build-15-piano-premium-boundary
      - fix/build-16-scripture-reference-navigation
      - fix/build-17-universal-scripture-links
    paths:
      - 'frontend/**'
      - 'scripts/**'
      - 'supabase/**'
      - '.github/workflows/quality-gate.yml'
  push:
    branches:
      - main
      - fix/build-13-acceptance-regressions
      - fix/build-14-global-audio-backgrounds
      - fix/build-15-piano-premium-boundary
      - fix/build-16-scripture-reference-navigation
      - fix/build-17-universal-scripture-links
    paths:
      - 'frontend/**'
      - 'scripts/**'
      - 'supabase/**'
      - '.github/workflows/quality-gate.yml'

permissions:
  contents: read

concurrency:
  group: scripture-games-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-build17-source:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/build-17-universal-scripture-links'
    name: Apply guarded Build 17 source patch
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out exact Build 17 branch
        uses: actions/checkout@v4
        with:
          ref: fix/build-17-universal-scripture-links
          fetch-depth: 0

      - name: Apply guarded source patch
        run: python scripts/apply-build17-scripture-links.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frozen dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile --non-interactive

      - name: Verify Build 16, Build 17, and TypeScript
        working-directory: frontend
        run: |
          yarn test:build16
          yarn test:build17
          yarn typecheck

      - name: Commit only verified source and consume patch machinery
        shell: bash
        run: |
          set -euo pipefail
          git config user.email actions@users.noreply.github.com
          git config user.name 'Scripture Games Source Bot'
          git rm -f scripts/apply-build17-scripture-links.py
          git rm -f .github/workflows/apply-build17-scripture-links.yml
          git rm -f .github/status-triggers/apply-build17-scripture-links.md
          git add frontend
          git commit -m 'feat: add universal Scripture links'
          git push origin HEAD:fix/build-17-universal-scripture-links

  validate:
    if: github.event_name != 'pull_request' || github.head_ref != 'fix/build-17-universal-scripture-links'
    name: Audit, typecheck, lint, and export
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir Pillow==11.3.0
          npm install --global yarn@1.22.22
          cd frontend
          yarn install --frozen-lockfile --non-interactive

      - name: Generate complete offline Bible
        working-directory: frontend
        run: yarn generate:bible

      - name: Audit complete Bible library
        working-directory: frontend
        run: yarn audit:bible

      - name: Audit optional cloud backup
        working-directory: frontend
        run: yarn audit:cloud

      - name: Audit premium faith and Lumi voice
        working-directory: frontend
        run: yarn audit:premium

      - name: Test Lumi response engine
        working-directory: frontend
        run: yarn test:lumi

      - name: Test Lumi microphone crash regressions
        working-directory: frontend
        run: yarn test:lumi-voice

      - name: Test Back navigation fallback
        working-directory: frontend
        run: yarn test:navigation

      - name: Test complete Bible journey requirements
        working-directory: frontend
        run: yarn test:journey

      - name: Test Build 13 acceptance corrections
        working-directory: frontend
        run: yarn test:acceptance

      - name: Test Build 14 global audio and backgrounds
        working-directory: frontend
        run: yarn test:build14

      - name: Test Build 15 piano and Premium boundary
        working-directory: frontend
        run: yarn test:build15

      - name: Test Build 16 Scripture-reference navigation
        working-directory: frontend
        run: yarn test:build16

      - name: Test Build 17 universal Scripture links
        working-directory: frontend
        run: yarn test:build17

      - name: Audit complete Bible journey source
        working-directory: frontend
        run: yarn audit:journey

      - name: Audit runtime stability and navigation
        working-directory: frontend
        run: yarn audit:runtime

      - name: Run content audit
        working-directory: frontend
        run: yarn audit:content

      - name: Run visual audit
        working-directory: frontend
        run: yarn audit:visual

      - name: Run Expo Doctor
        working-directory: frontend
        run: yarn doctor

      - name: Run TypeScript
        working-directory: frontend
        run: yarn typecheck

      - name: Run ESLint
        working-directory: frontend
        run: yarn lint

      - name: Export iOS bundle
        working-directory: frontend
        run: yarn export:ios

      - name: Export Android bundle
        working-directory: frontend
        run: yarn export:android
