name: Probe Scripture Games iOS Build 13 Status

on:
  push:
    branches:
      - fix/build-13-acceptance-regressions
    paths:
      - '.github/status-triggers/probe-ios-build13-status.md'

permissions:
  contents: write

jobs:
  probe:
    name: Read current EAS Build 13 status
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      BRANCH_NAME: fix/build-13-acceptance-regressions

    steps:
      - name: Verify Expo credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}"

      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: fix/build-13-acceptance-regressions
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Query Build 13 without starting work
        shell: bash
        run: |
          set -euo pipefail
          eas build:list --platform ios --app-build-version 13 --limit 1 --json --non-interactive > /tmp/build-list.json
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          data = json.loads(Path('/tmp/build-list.json').read_text())
          build = data[0] if isinstance(data, list) and data else {}
          if build:
              build_id = build.get('id')
              import subprocess
              with open('/tmp/build-view.json', 'w') as handle:
                  subprocess.run(['eas', 'build:view', build_id, '--json'], stdout=handle, check=True)
              build = json.loads(Path('/tmp/build-view.json').read_text())

          submissions = build.get('submissions') or []
          submission = submissions[0] if submissions else {}
          result = {
              'recorded_at': datetime.now(timezone.utc).isoformat(),
              'found': bool(build),
              'build_id': build.get('id'),
              'build_status': build.get('status'),
              'platform': build.get('platform'),
              'distribution': build.get('distribution'),
              'build_profile': build.get('buildProfile'),
              'app_version': build.get('appVersion'),
              'build_number': build.get('appBuildVersion'),
              'git_commit_hash': build.get('gitCommitHash'),
              'project_id': (build.get('project') or {}).get('id'),
              'submission_id': submission.get('id'),
              'submission_status': submission.get('status'),
              'asc_app_id': (submission.get('iosConfig') or {}).get('ascAppIdentifier'),
          }
          Path('BUILD_13_CURRENT_STATUS.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          PY

      - name: Commit current status probe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin "$BRANCH_NAME"
          git add BUILD_13_CURRENT_STATUS.json
          git commit -m 'release: probe current iOS Build 13 status'
          git push origin HEAD:"$BRANCH_NAME"
