name: Record Build 14 Release Run

on:
  push:
    branches:
      - fix/build-14-global-audio-backgrounds
    paths:
      - '.github/status-triggers/record-build14-release-run.md'

permissions:
  actions: read
  contents: write

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BRANCH_NAME: fix/build-14-global-audio-backgrounds
      TARGET_WORKFLOW_NAME: Authorized Scripture Games iOS Build 14
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/build-14-global-audio-backgrounds
          fetch-depth: 0

      - name: Find the single authorized release run
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for attempt in $(seq 1 60); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=${BRANCH_NAME}&per_page=100" > /tmp/runs.json
            if python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/runs.json').read_text())
          runs = [run for run in payload.get('workflow_runs', []) if run.get('name') == 'Authorized Scripture Games iOS Build 14']
          raise SystemExit(0 if len(runs) == 1 else 1)
          PY
            then
              found=1
              break
            fi
            sleep 10
          done
          test "$found" = 1

          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          payload = json.loads(Path('/tmp/runs.json').read_text())
          runs = [run for run in payload.get('workflow_runs', []) if run.get('name') == 'Authorized Scripture Games iOS Build 14']
          if len(runs) != 1:
              raise SystemExit(f'Expected exactly one authorized Build 14 run, found {len(runs)}')
          run = runs[0]
          result = {
              'recorded_at': datetime.now(timezone.utc).isoformat(),
              'run_id': run.get('id'),
              'run_number': run.get('run_number'),
              'status': run.get('status'),
              'conclusion': run.get('conclusion'),
              'event': run.get('event'),
              'head_branch': run.get('head_branch'),
              'head_sha': run.get('head_sha'),
              'created_at': run.get('created_at'),
              'updated_at': run.get('updated_at'),
              'jobs_url': run.get('jobs_url'),
          }
          Path('BUILD_14_GITHUB_RUN_STATUS.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          PY

      - name: Commit read-only run record
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin "$BRANCH_NAME"
          git add BUILD_14_GITHUB_RUN_STATUS.json
          git commit -m 'release: record authorized Build 14 workflow run'
          git push origin HEAD:"$BRANCH_NAME"
