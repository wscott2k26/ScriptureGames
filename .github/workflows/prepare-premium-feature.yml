name: Prepare Scripture Games Premium Feature

on:
  push:
    branches:
      - feature/premium-faith-journeys-prayer-garden
    paths:
      - '.github/feature-triggers/prepare-premium-feature.md'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/premium-faith-journeys-prayer-garden
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Generate exact dependency lock and apply small compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          npm install --global yarn@1.22.22
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/app/faith-journey.tsx')
          text = path.read_text()
          text = text.replace("label={complete ? 'Save Reflection' : 'Complete Day'}\n              loading={saving}", "label={saving ? 'Saving…' : complete ? 'Save Reflection' : 'Complete Day'}\n              disabled={saving}")
          path.write_text(text)
          PY
          cd frontend
          yarn install --non-interactive --network-timeout 600000

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package.json frontend/yarn.lock frontend/app/faith-journey.tsx
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Lock premium voice dependencies and fix journey save state'
          git push origin HEAD:feature/premium-faith-journeys-prayer-garden
