name: Prepare Scripture Games Premium Feature

on:
  push:
    branches:
      - feature/premium-faith-journeys-prayer-garden
    paths:
      - '.github/feature-triggers/prepare-premium-feature.md'

permissions:
  contents: write
  issues: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/premium-faith-journeys-prayer-garden
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Apply checked offline Bible narration patch
        run: python scripts/patch-premium-bible.py

      - name: Lock exact SDK 54 dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global yarn@1.22.22
          cd frontend
          yarn install --non-interactive --network-timeout 600000

      - name: Commit generated premium changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package.json frontend/yarn.lock 'frontend/app/(tabs)/bible.tsx'
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Add offline Bible chapter narration and lock premium dependencies'
          git push origin HEAD:feature/premium-faith-journeys-prayer-garden

      - name: Report preparation result
        if: always()
        shell: bash
        env:
          RESULT: ${{ job.status }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Scripture Games premium preparation ${RESULT} — run $GITHUB_RUN_ID" \
            --body "Branch: \`feature/premium-faith-journeys-prayer-garden\`\n\nResult: **$RESULT**\n\nThis workflow does not trigger an EAS build."
