name: Report Build 15 Release Status

on:
  push:
    branches:
      - fix/build-15-piano-premium-boundary
    paths:
      - '.github/status-triggers/report-build15-release-status.md'

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      EXCLUDED_PREFLIGHT_RUN: '30710824158'
    steps:
      - name: Find corrected release run
        id: find
        shell: bash
        run: |
          set -euo pipefail
          run_id=''
          for attempt in $(seq 1 120); do
            run_id=$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/ios-build15-testflight.yml/runs?branch=fix%2Fbuild-15-piano-premium-boundary&event=push&per_page=20" --jq --arg excluded "$EXCLUDED_PREFLIGHT_RUN" '.workflow_runs | map(select((.id|tostring) != $excluded)) | sort_by(.created_at) | reverse | .[0].id // empty')
            if [ -n "$run_id" ]; then break; fi
            sleep 10
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          status=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status')
          gh pr comment 46 --repo "$GITHUB_REPOSITORY" --body "Build 15 release status: corrected iOS/TestFlight run \`$run_id\` is \`$status\`. The prior run \`$EXCLUDED_PREFLIGHT_RUN\` stopped before Expo/EAS and spent no credit. This reporter is read-only."

      - name: Report terminal result
        shell: bash
        run: |
          set -euo pipefail
          run_id='${{ steps.find.outputs.run_id }}'
          status=''
          conclusion=''
          for attempt in $(seq 1 720); do
            status=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status')
            conclusion=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.conclusion // empty')
            if [ "$status" = 'completed' ]; then break; fi
            sleep 15
          done
          test "$status" = 'completed'
          gh pr comment 46 --repo "$GITHUB_REPOSITORY" --body "Build 15 release terminal result: run \`$run_id\` completed with \`$conclusion\`. Apple availability must also be confirmed by the TestFlight email."
          test "$conclusion" = 'success'
