name: Probe Build 21 Final Submit

on:
  push:
    branches:
      - monitor/build21-final-submit
    paths:
      - '.github/status-triggers/probe-build21-final-submit.md'

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Query exact submit-only workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          result=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow ios-build21-submit-only.yml \
            --branch release/build21-testflight-final-submit \
            --limit 1 \
            --json databaseId,status,conclusion,headSha,createdAt,updatedAt,url)
          echo "$result"
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Build 21 final submit status probe" \
            --body "Read-only workflow status probe. No build or submission command was executed. Result: \`$result\`"
