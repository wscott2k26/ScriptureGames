name: Scripture Games Build 22 iOS Only

on:
  push:
    branches:
      - release/build22-ios-only
    paths:
      - .github/release-trigger-build22-ios-only.txt

concurrency:
  group: scripture-games-build22-ios-only
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  build-ios-22:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SOURCE_SHA: f16acf2ebd843e4c189b8f20f6302dc382e84aa3
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Check out one-use release controller
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: release-control

      - name: Enforce immutable source and one-use boundary
        working-directory: release-control
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "release/build22-ios-only"
          test -n "$EXPO_TOKEN"

          expected_trigger=$'AUTHORIZE_ONE_IOS_BUILD_22_ONLY\nSOURCE_SHA=f16acf2ebd843e4c189b8f20f6302dc382e84aa3\nNO_SUBMISSION=TRUE\nNO_ANDROID=TRUE\nNO_RETRY=TRUE'
          actual_trigger="$(cat .github/release-trigger-build22-ios-only.txt)"
          test "$actual_trigger" = "$expected_trigger"

          git fetch origin main --depth=1
          remote_main="$(git rev-parse origin/main)"
          test "$remote_main" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD

          mapfile -t changed < <(git diff --name-only "$SOURCE_SHA"..HEAD | sort)
          printf '%s\n' "${changed[@]}" > /tmp/changed-files.txt
          cat > /tmp/expected-files.txt <<'FILES'
          .github/release-trigger-build22-ios-only.txt
          .github/workflows/build22-ios-only.yml
          FILES
          diff -u /tmp/expected-files.txt /tmp/changed-files.txt

          forbidden_submit="eas sub""mit"
          forbidden_auto="--auto-""submit"
          forbidden_testflight="npx test""flight"
          for forbidden in "$forbidden_submit" "$forbidden_auto" "$forbidden_testflight"; do
            if grep -Fq -- "$forbidden" .github/workflows/build22-ios-only.yml; then
              echo "Prohibited submission command found: $forbidden" >&2
              exit 1
            fi
          done

          if grep -Eq 'eas build[^\n]*(--platform android|--platform all)' .github/workflows/build22-ios-only.yml; then
            echo "Android or multi-platform build command is prohibited." >&2
            exit 1
          fi

      - name: Check out exact Build 22 app source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          path: source

      - name: Verify exact source checkout
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git status --porcelain)" = ""

      - name: Open protected build tracking issue
        id: tracker
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          issue_url=$(gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Build 22 iOS build in progress — no TestFlight upload" \
            --body "Authorized exactly one iOS production Build 22 from immutable source \`$SOURCE_SHA\`. This workflow contains no submission command, no Android build, and no retry authorization. GitHub run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          issue_number="${issue_url##*/}"
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: source/frontend/yarn.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned validation and EAS tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir Pillow==11.3.0
          npm install --global yarn@1.22.22
          npm install --global eas-cli@16.20.0

      - name: Install frozen app dependencies
        working-directory: source/frontend
        run: yarn install --frozen-lockfile --non-interactive

      - name: Quad-check Build 22 store source contract
        working-directory: source/frontend
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          const eas = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const core = fs.readFileSync('src/purchases/purchase-core.ts', 'utf8');
          const client = fs.readFileSync('src/purchases/purchase-client.native.ts', 'utf8');

          const checks = [
            [app.expo?.ios?.bundleIdentifier === 'com.willywill.scripturegames', 'iOS bundle identifier mismatch'],
            [app.expo?.extra?.eas?.projectId === '18710e80-2a62-46ac-8d3a-d1711b7d920a', 'EAS project ID mismatch'],
            [eas.build?.production?.environment === 'production', 'production EAS environment is not explicit'],
            [eas.build?.production?.autoIncrement === true, 'production autoIncrement is not enabled'],
            [pkg.dependencies?.['react-native-purchases'] === '10.4.4', 'RevenueCat dependency is not pinned to 10.4.4'],
            [core.includes("PREMIUM_PRODUCT_ID = 'com.willywill.scripturegames.premium'"), 'Apple product ID mismatch'],
            [core.includes("PREMIUM_ENTITLEMENT_ID = 'premium'"), 'RevenueCat entitlement mismatch'],
            [client.includes('EXPO_PUBLIC_REVENUECAT_APPLE_API_KEY'), 'RevenueCat environment variable is not consumed'],
            [client.includes('ENTITLEMENT_VERIFICATION_MODE.INFORMATIONAL'), 'RevenueCat entitlement verification mode missing'],
          ];
          const failures = checks.filter(([ok]) => !ok).map(([, message]) => message);
          if (failures.length) throw new Error(failures.join('; '));
          console.log('Build 22 store source contract verified.');
          NODE

      - name: Verify RevenueCat Apple production key exists in EAS
        working-directory: source/frontend
        shell: bash
        run: |
          set -euo pipefail
          eas env:get production \
            --variable-name EXPO_PUBLIC_REVENUECAT_APPLE_API_KEY \
            --format short > /tmp/revenuecat-production-key.txt
          node <<'NODE'
          const fs = require('fs');
          const output = fs.readFileSync('/tmp/revenuecat-production-key.txt', 'utf8');
          if (!/appl_[A-Za-z0-9_-]+/.test(output)) {
            throw new Error('Production RevenueCat Apple public SDK key was not found or does not use the appl_ prefix.');
          }
          if (/test_[A-Za-z0-9_-]+/.test(output)) {
            throw new Error('Test Store key detected where the Apple production key is required.');
          }
          console.log('RevenueCat Apple production key presence verified without printing the key.');
          NODE
          rm -f /tmp/revenuecat-production-key.txt

      - name: Verify Build 21 is latest and Build 22 does not exist
        working-directory: source/frontend
        shell: bash
        run: |
          set -euo pipefail
          eas build:list --platform ios --limit 100 --json --non-interactive > /tmp/ios-builds-before.json
          node <<'NODE'
          const fs = require('fs');
          const parsed = JSON.parse(fs.readFileSync('/tmp/ios-builds-before.json', 'utf8'));
          const builds = Array.isArray(parsed) ? parsed : (parsed.builds || parsed.results || []);
          const ios = builds.filter((build) => String(build.platform || '').toUpperCase() === 'IOS');
          const build22 = ios.filter((build) => String(build.appBuildVersion || '') === '22');
          if (build22.length > 0) {
            throw new Error(`Build 22 already exists (${build22.map((build) => build.id).join(', ')}); refusing a duplicate paid build.`);
          }

          const activeStatuses = new Set(['NEW', 'CREATED', 'PENDING', 'IN_QUEUE', 'IN_PROGRESS']);
          const activeProduction = ios.filter((build) =>
            String(build.buildProfile || '').toLowerCase() === 'production' &&
            activeStatuses.has(String(build.status || '').toUpperCase())
          );
          if (activeProduction.length > 0) {
            throw new Error(`An iOS production build is already active (${activeProduction.map((build) => build.id).join(', ')}).`);
          }

          const finished21 = ios.find((build) =>
            String(build.appBuildVersion || '') === '21' &&
            String(build.status || '').toUpperCase() === 'FINISHED'
          );
          if (!finished21) throw new Error('A finished iOS Build 21 record was not found.');

          const numericVersions = ios
            .map((build) => Number.parseInt(String(build.appBuildVersion || ''), 10))
            .filter(Number.isFinite);
          const latest = numericVersions.length ? Math.max(...numericVersions) : 0;
          if (latest !== 21) throw new Error(`Latest known iOS build number is ${latest}, not 21.`);
          console.log(`Verified finished Build 21 ${finished21.id}; Build 22 is absent and no production build is active.`);
          NODE

      - name: Run complete no-regression source gate
        working-directory: source/frontend
        run: yarn validate

      - name: Confirm validation did not mutate source
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(git status --porcelain --untracked-files=no)" = ""

      - name: Launch exactly one iOS production Build 22
        id: launch
        working-directory: source/frontend
        shell: bash
        run: |
          set -euo pipefail
          eas build --platform ios --profile production --non-interactive --no-wait --json > /tmp/build22-launch.json
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const parsed = JSON.parse(fs.readFileSync('/tmp/build22-launch.json', 'utf8'));
          const builds = Array.isArray(parsed) ? parsed : (parsed.builds || [parsed]);
          if (builds.length !== 1) throw new Error(`Expected exactly one build, received ${builds.length}.`);
          const build = builds[0];
          const checks = [
            [Boolean(build.id), 'EAS did not return a build ID'],
            [String(build.platform || '').toUpperCase() === 'IOS', `platform=${build.platform}`],
            [String(build.buildProfile || '').toLowerCase() === 'production', `profile=${build.buildProfile}`],
            [String(build.distribution || '').toUpperCase() === 'STORE', `distribution=${build.distribution}`],
            [String(build.appBuildVersion || '') === '22', `appBuildVersion=${build.appBuildVersion}`],
            [String(build.appVersion || '') === '1.0.0', `appVersion=${build.appVersion}`],
          ];
          const failures = checks.filter(([ok]) => !ok).map(([, message]) => message);
          if (failures.length) throw new Error(`Launch verification failed: ${failures.join('; ')}`);
          console.log(`build_id=${build.id}`);
          NODE

      - name: Record exact EAS Build 22 ID
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.tracker.outputs.issue_number }}
          BUILD_ID: ${{ steps.launch.outputs.build_id }}
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Exact iOS production Build 22 launched from immutable source \`$SOURCE_SHA\`.\n\n- EAS build ID: \`$BUILD_ID\`\n- Release-controller commit: \`$GITHUB_SHA\`\n- Apple/TestFlight upload: not authorized and not present\n- Android build: not present\n- Retry: not authorized\n- GitHub run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Wait for exact Build 22 result
        id: verify
        working-directory: source/frontend
        shell: bash
        env:
          BUILD_ID: ${{ steps.launch.outputs.build_id }}
        run: |
          set -euo pipefail
          terminal=0
          for attempt in $(seq 1 220); do
            eas build:view "$BUILD_ID" --json > /tmp/build22-view.json
            status=$(node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('/tmp/build22-view.json','utf8')); const b=p.build||p; process.stdout.write(String(b.status||''));")
            echo "Build status: $status"
            case "$status" in
              FINISHED)
                terminal=1
                break
                ;;
              ERRORED|CANCELED)
                echo "Build ended with status $status" >&2
                exit 1
                ;;
            esac
            sleep 30
          done
          test "$terminal" = "1"

          node <<'NODE'
          const fs = require('fs');
          const parsed = JSON.parse(fs.readFileSync('/tmp/build22-view.json', 'utf8'));
          const build = parsed.build || parsed;
          const sourceSha = process.env.SOURCE_SHA;
          const checks = [
            [String(build.status || '').toUpperCase() === 'FINISHED', `status=${build.status}`],
            [String(build.platform || '').toUpperCase() === 'IOS', `platform=${build.platform}`],
            [String(build.buildProfile || '').toLowerCase() === 'production', `profile=${build.buildProfile}`],
            [String(build.distribution || '').toUpperCase() === 'STORE', `distribution=${build.distribution}`],
            [String(build.appVersion || '') === '1.0.0', `appVersion=${build.appVersion}`],
            [String(build.appBuildVersion || '') === '22', `appBuildVersion=${build.appBuildVersion}`],
            [String(build.gitCommitHash || '') === sourceSha, `gitCommitHash=${build.gitCommitHash}, expected=${sourceSha}`],
            [!build.submission, 'unexpected submission field present'],
            [Boolean(build.artifacts?.buildUrl), 'signed iOS artifact URL missing'],
          ];
          const failures = checks.filter(([ok]) => !ok).map(([, message]) => message);
          if (failures.length) throw new Error(`Build verification failed: ${failures.join('; ')}`);
          fs.writeFileSync('/tmp/build22-record.json', JSON.stringify(build, null, 2));
          console.log(`Verified Build 22 ${build.id} from ${build.gitCommitHash} with no submission.`);
          NODE

      - name: Post-build duplicate and active-build audit
        working-directory: source/frontend
        shell: bash
        env:
          BUILD_ID: ${{ steps.launch.outputs.build_id }}
        run: |
          set -euo pipefail
          eas build:list --platform ios --limit 100 --json --non-interactive > /tmp/ios-builds-after.json
          node <<'NODE'
          const fs = require('fs');
          const expectedId = process.env.BUILD_ID;
          const parsed = JSON.parse(fs.readFileSync('/tmp/ios-builds-after.json', 'utf8'));
          const builds = Array.isArray(parsed) ? parsed : (parsed.builds || parsed.results || []);
          const build22 = builds.filter((build) =>
            String(build.platform || '').toUpperCase() === 'IOS' &&
            String(build.appBuildVersion || '') === '22'
          );
          if (build22.length !== 1) throw new Error(`Expected exactly one Build 22 record; found ${build22.length}.`);
          if (String(build22[0].id) !== String(expectedId)) throw new Error(`Build 22 ID mismatch: ${build22[0].id} vs ${expectedId}.`);
          if (String(build22[0].status || '').toUpperCase() !== 'FINISHED') throw new Error(`Build 22 status is ${build22[0].status}.`);
          const activeStatuses = new Set(['NEW', 'CREATED', 'PENDING', 'IN_QUEUE', 'IN_PROGRESS']);
          const activeProduction = builds.filter((build) =>
            String(build.platform || '').toUpperCase() === 'IOS' &&
            String(build.buildProfile || '').toLowerCase() === 'production' &&
            activeStatuses.has(String(build.status || '').toUpperCase())
          );
          if (activeProduction.length > 0) throw new Error(`Unexpected active production builds: ${activeProduction.map((b) => b.id).join(', ')}`);
          console.log('Post-build audit verified exactly one finished iOS Build 22 and zero active duplicates.');
          NODE

      - name: Preserve Build 22 verification record
        uses: actions/upload-artifact@v4
        with:
          name: scripture-games-build22-ios-record
          path: /tmp/build22-record.json
          retention-days: 30

      - name: Mark Build 22 verified
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.tracker.outputs.issue_number }}
          BUILD_ID: ${{ steps.launch.outputs.build_id }}
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --title "Build 22 iOS build verified — TestFlight not uploaded" \
            --body "The exact one-time iOS production Build 22 completed and passed post-build verification.\n\n- EAS build ID: \`$BUILD_ID\`\n- App version: \`1.0.0\`\n- iOS build number: \`22\`\n- Immutable app source: \`$SOURCE_SHA\`\n- TestFlight/App Store Connect submission: zero; separate authorization required\n- Android build: zero\n- Duplicate Build 22 records: zero\n- GitHub run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Record protected failure without retry
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.tracker.outputs.issue_number }}
          BUILD_ID: ${{ steps.launch.outputs.build_id }}
        run: |
          set -euo pipefail
          body="Build 22 workflow stopped or failed. No retry is authorized.\n\n- Immutable app source: \`$SOURCE_SHA\`\n- EAS build ID (if launched): \`${BUILD_ID:-not launched}\`\n- TestFlight upload: not performed\n- Android build: not performed\n- Retry: not performed\n- GitHub run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -n "${ISSUE_NUMBER:-}" ]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --title "Build 22 iOS build stopped — no retry authorized" \
              --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Build 22 iOS build stopped — no retry authorized" \
              --body "$body"
          fi
