name: Monitor Build 16 TestFlight

on:
  push:
    branches:
      - monitor/build16-testflight-status
    paths:
      - '.github/status-triggers/monitor-build16-testflight.md'

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Find the authorized Build 16 release run
        id: find
        shell: bash
        run: |
          set -euo pipefail
          run_id=''
          for attempt in $(seq 1 120); do
            run_id=$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/ios-build16-testflight.yml/runs?branch=fix%2Fbuild-16-scripture-reference-navigation&event=push&per_page=10" --jq '.workflow_runs | sort_by(.created_at) | reverse | .[0].id // empty')
            if [ -n "$run_id" ]; then break; fi
            sleep 10
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          status=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status')
          gh pr comment 49 --repo "$GITHUB_REPOSITORY" --body "Build 16 release monitor: authorized iOS/TestFlight run \`$run_id\` is \`$status\`. This monitor is read-only and cannot build, submit, retry, cancel, or spend a credit."

      - name: Wait for terminal GitHub result
        shell: bash
        run: |
          set -euo pipefail
          run_id='${{ steps.find.outputs.run_id }}'
          status=''
          conclusion=''
          for attempt in $(seq 1 720); do
            status=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status')
            conclusion=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.conclusion // empty')
            if [ "$status" = 'completed' ]; then break; fi
            sleep 15
          done
          test "$status" = 'completed'
          gh pr comment 49 --repo "$GITHUB_REPOSITORY" --body "Build 16 release terminal result: run \`$run_id\` completed with \`$conclusion\`. Apple availability is verified separately by TestFlight email."
          test "$conclusion" = 'success'
