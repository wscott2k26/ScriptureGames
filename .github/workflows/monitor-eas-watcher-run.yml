name: Monitor EAS Watcher Run

on:
  push:
    branches:
      - feature/complete-bible-journey-upgrade
    paths:
      - '.github/status-triggers/query-eas-watcher-run.md'

permissions:
  actions: read
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 220
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: feature/complete-bible-journey-upgrade
      TARGET_WORKFLOW: monitor-eas-build-12.yml

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/complete-bible-journey-upgrade
          fetch-depth: 0

      - name: Record watcher run ID
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/run-status
          run_json="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$TARGET_WORKFLOW" --branch "$TARGET_BRANCH" --limit 1 --json databaseId,status,conclusion,url,createdAt,updatedAt,headSha,event,workflowName)"
          test "$(jq 'length' <<<"$run_json")" -eq 1
          jq '.[0]' <<<"$run_json" > .github/run-status/eas-watcher-run-start.json
          echo "RUN_ID=$(jq -r '.[0].databaseId' <<<"$run_json")" >> "$GITHUB_ENV"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/run-status/eas-watcher-run-start.json
          git commit -m 'ci: record EAS watcher run ID' || true
          git push origin HEAD:"$TARGET_BRANCH"

      - name: Record watcher conclusion
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 180); do
            gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json databaseId,status,conclusion,url,createdAt,updatedAt,headSha,event,workflowName > /tmp/eas-watcher-run.json
            [ "$(jq -r '.status' /tmp/eas-watcher-run.json)" = 'completed' ] && break
            sleep 60
          done
          cp /tmp/eas-watcher-run.json .github/run-status/eas-watcher-run-final.json
          git pull --rebase origin "$TARGET_BRANCH"
          git add .github/run-status/eas-watcher-run-final.json
          git commit -m 'ci: record EAS watcher conclusion' || true
          git push origin HEAD:"$TARGET_BRANCH"
