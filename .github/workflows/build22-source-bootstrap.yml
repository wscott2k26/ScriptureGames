# Final source-bootstrap pass after TypeScript compatibility fixes.
name: Build 22 Source Bootstrap

on:
  push:
    branches:
      - feature/build22-revenuecat-apple-premium
    paths:
      - 'frontend/package.json'
      - '.github/workflows/build22-source-bootstrap.yml'

permissions:
  contents: write

concurrency:
  group: build22-source-bootstrap
  cancel-in-progress: false

jobs:
  lock-and-check:
    name: Generate frozen lock and run focused source checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Build 22 branch
        uses: actions/checkout@v4
        with:
          ref: feature/build22-revenuecat-apple-premium
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22

      - name: Regenerate dependency lock
        working-directory: frontend
        run: yarn install --non-interactive

      - name: Commit only the generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add frontend/yarn.lock
          if git diff --cached --quiet; then
            echo "Lockfile already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: lock RevenueCat dependency tree"
            git push origin HEAD:feature/build22-revenuecat-apple-premium
          fi

      - name: Run Build 22 purchase contract
        working-directory: frontend
        run: yarn test:build22

      - name: Run store configuration audit
        working-directory: frontend
        run: yarn audit:store

      - name: Run Build 15 regression contract
        working-directory: frontend
        run: yarn test:build15

      - name: Run TypeScript
        working-directory: frontend
        run: yarn typecheck

      - name: Run ESLint
        working-directory: frontend
        run: yarn lint
