name: Apply Build 15 Guarded Patch

on:
  push:
    branches:
      - fix/build-15-piano-premium-boundary
    paths:
      - '.github/build15-apply.trigger'

permissions:
  contents: write

concurrency:
  group: scripture-games-build15-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: fix/build-15-piano-premium-boundary
          fetch-depth: 0

      - name: Apply guarded source patch
        run: python scripts/apply-build15-fix.py

      - name: Remove one-time patch machinery
        run: |
          rm -f scripts/apply-build15-fix.py
          rm -f .github/build15-apply.trigger
          rm -f .github/workflows/build15-apply.yml

      - name: Commit corrected Build 15 source
        run: |
          git config user.name "Scripture Games Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "fix: complete Build 15 piano Premium and quiz reference flow"
          git push origin HEAD:fix/build-15-piano-premium-boundary
