name: Align Build 20 Recovery History

on:
  push:
    branches:
      - recovery/build20-pr-head
    paths:
      - '.github/workflows/align-build20-history.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - name: Check out verified recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery/build20-pr-head
          fetch-depth: 0

      - name: Attach current main ancestry without changing verified files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          before_tree="$(git rev-parse HEAD^{tree})"
          git merge -s ours --no-edit origin/main -m 'chore: align verified recovery history with current main'
          after_tree="$(git rev-parse HEAD^{tree})"
          test "$before_tree" = "$after_tree"
          git push origin HEAD:recovery/build20-pr-head
