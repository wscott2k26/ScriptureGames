name: Monitor Scripture Games Build 12 Submission

on:
  push:
    branches:
      - feature/complete-bible-journey-upgrade
    paths:
      - '.github/status-triggers/query-eas-build-12.md'

permissions:
  contents: write

concurrency:
  group: scripture-games-monitor-eas-build-12
  cancel-in-progress: true

jobs:
  monitor:
    name: Poll existing Build 12 TestFlight submission
    runs-on: ubuntu-latest
    timeout-minutes: 220
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      TARGET_BRANCH: feature/complete-bible-journey-upgrade
      BUILD_ID: e2a4f099-4653-4aaf-bd81-59bb39f2cc09
      SUBMISSION_ID: 1b68db84-cd2c-4a38-80ac-04420f8fe267

    steps:
      - name: Verify protected Expo credential exists
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}"

      - name: Check out monitoring branch
        uses: actions/checkout@v4
        with:
          ref: feature/complete-bible-journey-upgrade
          fetch-depth: 0

      - name: Query and record initial submission state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/run-status
          payload=$(jq -n --arg submissionId "$SUBMISSION_ID" '{query:"query SubmissionsByIdQuery($submissionId: ID!) { submissions { byId(submissionId: $submissionId) { id status platform createdAt updatedAt } } }",variables:{submissionId:$submissionId}}')
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $EXPO_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            https://api.expo.dev/graphql > .github/run-status/build-12-submission-initial.json

          if jq -e '.errors and (.errors | length > 0)' .github/run-status/build-12-submission-initial.json >/dev/null; then
            jq '.errors' .github/run-status/build-12-submission-initial.json >&2
            exit 1
          fi

          jq -e --arg id "$SUBMISSION_ID" '.data.submissions.byId.id == $id' .github/run-status/build-12-submission-initial.json >/dev/null

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/run-status/build-12-submission-initial.json
          git commit -m 'ci: record Build 12 initial submission state' || true
          git push origin HEAD:"$TARGET_BRANCH"

      - name: Poll the existing submission until terminal
        shell: bash
        run: |
          set -euo pipefail
          payload=$(jq -n --arg submissionId "$SUBMISSION_ID" '{query:"query SubmissionsByIdQuery($submissionId: ID!) { submissions { byId(submissionId: $submissionId) { id status platform createdAt updatedAt } } }",variables:{submissionId:$submissionId}}')

          for _ in $(seq 1 180); do
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $EXPO_TOKEN" \
              -H 'Content-Type: application/json' \
              --data "$payload" \
              https://api.expo.dev/graphql > /tmp/build-12-submission.json

            if jq -e '.errors and (.errors | length > 0)' /tmp/build-12-submission.json >/dev/null; then
              jq '.errors' /tmp/build-12-submission.json >&2
              exit 1
            fi

            status=$(jq -r '.data.submissions.byId.status // "UNKNOWN"' /tmp/build-12-submission.json)
            case "$status" in
              FINISHED|ERRORED|CANCELED) break ;;
            esac
            sleep 60
          done

          mkdir -p .github/run-status
          cp /tmp/build-12-submission.json .github/run-status/build-12-submission-final.json
          git pull --rebase origin "$TARGET_BRANCH"
          git add .github/run-status/build-12-submission-final.json
          git commit -m 'ci: record Build 12 final submission state' || true
          git push origin HEAD:"$TARGET_BRANCH"

          status=$(jq -r '.data.submissions.byId.status // "UNKNOWN"' /tmp/build-12-submission.json)
          test "$status" = 'FINISHED'
