name: Diagnose Scripture Games EAS Build 12

on:
  push:
    branches:
      - feature/complete-bible-journey-upgrade
    paths:
      - '.github/status-triggers/query-eas-build-12.md'

permissions:
  contents: write

concurrency:
  group: scripture-games-monitor-eas-build-12
  cancel-in-progress: true

jobs:
  diagnose:
    name: Record EAS build query diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      TARGET_BRANCH: feature/complete-bible-journey-upgrade
      BUILD_ID: e2a4f099-4653-4aaf-bd81-59bb39f2cc09
      SOURCE_SHA: 67b0a77d84f7752077b884659b9f65dec8d08756

    steps:
      - name: Verify protected Expo credential exists
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}"

      - name: Check out monitoring branch
        uses: actions/checkout@v4
        with:
          ref: feature/complete-bible-journey-upgrade
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}

      - name: Capture project and build query output
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .github/run-status

          cd frontend
          eas whoami > /tmp/eas-whoami.out 2> /tmp/eas-whoami.err
          whoami_exit=$?
          eas project:info --non-interactive > /tmp/eas-project-info.out 2> /tmp/eas-project-info.err
          project_exit=$?
          eas build:view "$BUILD_ID" --json > /tmp/eas-build-view.out 2> /tmp/eas-build-view.err
          view_exit=$?
          eas build:list --platform ios --limit 20 --json --non-interactive > /tmp/eas-build-list.out 2> /tmp/eas-build-list.err
          list_exit=$?
          cd ..

          jq -n \
            --arg buildId "$BUILD_ID" \
            --arg sourceSha "$SOURCE_SHA" \
            --argjson whoamiExit "$whoami_exit" \
            --arg whoamiOut "$(cat /tmp/eas-whoami.out)" \
            --arg whoamiErr "$(cat /tmp/eas-whoami.err)" \
            --argjson projectExit "$project_exit" \
            --arg projectOut "$(cat /tmp/eas-project-info.out)" \
            --arg projectErr "$(cat /tmp/eas-project-info.err)" \
            --argjson viewExit "$view_exit" \
            --arg viewOut "$(cat /tmp/eas-build-view.out)" \
            --arg viewErr "$(cat /tmp/eas-build-view.err)" \
            --argjson listExit "$list_exit" \
            --arg listOut "$(cat /tmp/eas-build-list.out)" \
            --arg listErr "$(cat /tmp/eas-build-list.err)" \
            '{buildId:$buildId,sourceSha:$sourceSha,whoami:{exit:$whoamiExit,stdout:$whoamiOut,stderr:$whoamiErr},projectInfo:{exit:$projectExit,stdout:$projectOut,stderr:$projectErr},buildView:{exit:$viewExit,stdout:$viewOut,stderr:$viewErr},buildList:{exit:$listExit,stdout:$listOut,stderr:$listErr}}' \
            > .github/run-status/eas-build-12-query-diagnostics.json

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/run-status/eas-build-12-query-diagnostics.json
          git commit -m 'ci: record EAS Build 12 query diagnostics' || true
          git push origin HEAD:"$TARGET_BRANCH"
