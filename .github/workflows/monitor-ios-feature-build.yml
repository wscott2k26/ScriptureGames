name: Monitor Scripture Games Authorized iOS Feature Build

on:
  push:
    branches:
      - feature/complete-bible-journey-upgrade
    paths:
      - '.github/status-triggers/query-ios-feature-build.md'

permissions:
  actions: read
  contents: write

concurrency:
  group: scripture-games-monitor-ios-feature-build
  cancel-in-progress: true

jobs:
  monitor:
    name: Record authorized iOS build status
    runs-on: ubuntu-latest
    timeout-minutes: 220
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: feature/complete-bible-journey-upgrade
      TARGET_WORKFLOW: ios-feature-build-once.yml

    steps:
      - name: Check out monitoring branch
        uses: actions/checkout@v4
        with:
          ref: feature/complete-bible-journey-upgrade
          fetch-depth: 0

      - name: Find the single authorized build run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/run-status
          run_json="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$TARGET_WORKFLOW" --branch "$TARGET_BRANCH" --limit 1 --json databaseId,status,conclusion,url,createdAt,updatedAt,headSha,event,workflowName)"
          if [ "$(jq 'length' <<<"$run_json")" -ne 1 ]; then
            echo 'Unable to locate the authorized iOS feature build run.' >&2
            exit 1
          fi
          jq '.[0]' <<<"$run_json" > .github/run-status/ios-feature-build-start.json
          echo "RUN_ID=$(jq -r '.[0].databaseId' <<<"$run_json")" >> "$GITHUB_ENV"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/run-status/ios-feature-build-start.json
          git commit -m 'ci: record authorized iOS build run' || true
          git push origin HEAD:"$TARGET_BRANCH"

      - name: Watch until the authorized run completes
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 180); do
            gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json databaseId,status,conclusion,url,createdAt,updatedAt,headSha,event,workflowName > /tmp/ios-feature-build-status.json
            status="$(jq -r '.status' /tmp/ios-feature-build-status.json)"
            if [ "$status" = 'completed' ]; then
              break
            fi
            sleep 60
          done

          if [ "$(jq -r '.status' /tmp/ios-feature-build-status.json)" != 'completed' ]; then
            echo 'Authorized iOS feature build did not complete inside the monitor window.' >&2
            exit 1
          fi

          cp /tmp/ios-feature-build-status.json .github/run-status/ios-feature-build-final.json
          git pull --rebase origin "$TARGET_BRANCH"
          git add .github/run-status/ios-feature-build-final.json
          git commit -m 'ci: record authorized iOS build conclusion' || true
          git push origin HEAD:"$TARGET_BRANCH"
