name: Build 21 Source Patch

on:
  push:
    branches:
      - fix/build21-five-books-scripture-links
    paths:
      - '.github/status-triggers/build21-source-patch.md'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/build21-five-books-scripture-links
          fetch-depth: 0

      - name: Apply minimal Build 21 source fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('.')

          def replace(path: str, old: str, new: str) -> None:
              file = root / path
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Missing expected text in {path}: {old}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          replace(
              'frontend/src/bible-journey/catalog.ts',
              "const FREE_JOURNEY_BOOK_IDS = new Set(['GEN', 'EXO', 'LEV', 'MAT']);",
              "const FREE_JOURNEY_BOOK_IDS = new Set(['GEN', 'EXO', 'LEV', 'NUM', 'DEU', 'MAT', 'MRK', 'LUK', 'JHN', 'ACT']);",
          )

          replace(
              'frontend/app/book-trial.tsx',
              "import { TactilePressable as Pressable } from '@/src/components/premium/TactilePressable';",
              "import { TactilePressable as Pressable } from '@/src/components/premium/TactilePressable';\nimport { ScriptureLink } from '@/src/components/ScriptureLink';",
          )
          replace(
              'frontend/app/book-trial.tsx',
              "return fallback(`${catalogBook.name} requires Premium.`, 'Genesis, Exodus, and Leviticus are free. Premium opens the remaining 63 books.', true);",
              "return fallback(`${catalogBook.name} requires Premium.`, 'Genesis through Deuteronomy and Matthew through Acts are free. Premium opens the remaining 56 books.', true);",
          )
          replace(
              'frontend/app/book-trial.tsx',
              '<Text style={styles.resultReference}>{question.reference}</Text>',
              '<ScriptureLink reference={question.reference} returnLabel={`Return to ${catalogBook.name} Results`} testID="book-trial-result-scripture" />',
          )
          replace(
              'frontend/app/book-trial.tsx',
              '<Text style={styles.questionReference}>{question.reference}</Text>',
              '<Text style={styles.questionReference}>REFERENCE REVEALED AFTER ANSWER</Text>',
          )
          replace(
              'frontend/app/book-trial.tsx',
              '<Text style={styles.explanationReference}>{question.reference}</Text>',
              '<ScriptureLink reference={question.reference} returnLabel={`Return to ${catalogBook.name} Trial`} testID="book-trial-feedback-scripture" />',
          )

          replace(
              'frontend/app/book-mastery.tsx',
              '            <ScriptureLink reference={question.reference} label="Open Passage Before Answering" returnLabel="Return to Book Mastery" testID="mastery-open-passage" />\n',
              '',
          )

          premium = root / 'frontend/app/premium.tsx'
          premium_text = premium.read_text(encoding='utf-8')
          substitutions = {
              "['Remaining 62 Journey Books', 'Genesis, Exodus, Leviticus, and Matthew remain free. Premium opens the other 62 book seasons.']": "['Remaining 56 Journey Books', 'Genesis through Deuteronomy and Matthew through Acts remain free. Premium opens the other 56 book seasons.']",
              "['Four Full Books', 'Genesis Tournament plus the complete Exodus, Leviticus, and Matthew trial seasons.']": "['Ten Full Books', 'Genesis Tournament plus complete Exodus–Deuteronomy and Matthew–Acts trial seasons.']",
              "'Continue beyond the four free books.'": "'Continue beyond the ten free books.'",
              "'The remaining 62 Journey books and all 50 peaceful backgrounds are available on this player profile.'": "'The remaining 56 Journey books and all 50 peaceful backgrounds are available on this player profile.'",
              "'Genesis, Exodus, Leviticus, and Matthew are free. Premium opens the remaining 62 Journey books, all mastery records, and the full peaceful background collection.'": "'Genesis through Deuteronomy and Matthew through Acts are free. Premium opens the remaining 56 Journey books, all mastery records, and the full peaceful background collection.'",
          }
          for old, new in substitutions.items():
              if old not in premium_text:
                  raise SystemExit(f'Missing expected Premium text: {old}')
              premium_text = premium_text.replace(old, new)
          premium.write_text(premium_text, encoding='utf-8')

          tutorial = root / 'frontend/src/tutorial-core.ts'
          tutorial_text = tutorial.read_text(encoding='utf-8')
          tutorial_text = tutorial_text.replace(
              "'Genesis, Exodus, Leviticus, and Matthew are free. The remaining 62 Journey books require Premium.'",
              "'Genesis through Deuteronomy and Matthew through Acts are free. The remaining 56 Journey books require Premium.'",
          ).replace(
              "'Premium clearly opens the remaining 62 Journey books and Premium peaceful-photo collection once a validated store entitlement exists.'",
              "'Premium clearly opens the remaining 56 Journey books and Premium peaceful-photo collection once a validated store entitlement exists.'",
          )
          tutorial.write_text(tutorial_text, encoding='utf-8')
          PY

      - name: Commit repaired source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Scripture Games CI'
          git config user.email 'actions@users.noreply.github.com'
          git add frontend/src/bible-journey/catalog.ts frontend/app/book-trial.tsx frontend/app/book-mastery.tsx frontend/app/premium.tsx frontend/src/tutorial-core.ts
          git commit -m 'fix: open ten Journey books and protect Scripture answers'
          git push origin HEAD:fix/build21-five-books-scripture-links
