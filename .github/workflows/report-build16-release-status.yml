name: Report Build 16 Release Status

on:
  push:
    branches:
      - fix/build-16-scripture-reference-navigation
    paths:
      - '.github/status-triggers/report-build16-release-status.md'

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Find authorized Build 16 release run
        id: find
        shell: bash
        run: |
          set -euo pipefail
          run_id=''
          for attempt in $(seq 1 120); do
            run_id=$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/ios-build16-testflight.yml/runs?branch=fix%2Fbuild-16-scripture-reference-navigation&event=push&per_page=10" --jq '.workflow_runs | sort_by(.created_at) | reverse | .[0].id // empty')
            if [ -n "$run_id" ]; then break; fi
            sleep 10
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          status=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status')
          issue_url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "Build 16 release status — $run_id" --body "Authorized iOS/TestFlight release run: \`$run_id\`\n\nCurrent GitHub status: **$status**\n\nThis is a read-only reporter. It cannot build, submit, retry, cancel, or spend a credit.")
          issue_number=${issue_url##*/}
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"

      - name: Wait for terminal result and update issue
        shell: bash
        run: |
          set -euo pipefail
          run_id='${{ steps.find.outputs.run_id }}'
          issue_number='${{ steps.find.outputs.issue_number }}'
          status=''
          conclusion=''
          for attempt in $(seq 1 720); do
            status=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status')
            conclusion=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.conclusion // empty')
            if [ "$status" = 'completed' ]; then break; fi
            sleep 15
          done
          test "$status" = 'completed'
          gh issue edit "$issue_number" --repo "$GITHUB_REPOSITORY" --body "Authorized iOS/TestFlight release run: \`$run_id\`\n\nTerminal GitHub conclusion: **$conclusion**\n\nApple availability is verified separately through TestFlight email.\n\nThis was a read-only reporter."
