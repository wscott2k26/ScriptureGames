name: Monitor RC3 V3 Retry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/monitor-rc3-v3-retry.yml'

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for the freshly dispatched V3 run
        shell: bash
        run: |
          set -euo pipefail
          for cycle in $(seq 1 240); do
            json="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow rc3-certification-v3.yml --limit 1 --json databaseId,status,conclusion,url,createdAt,headSha)"
            run_id="$(printf '%s' "$json" | jq -r '.[0].databaseId // empty')"
            status="$(printf '%s' "$json" | jq -r '.[0].status // "missing"')"
            conclusion="$(printf '%s' "$json" | jq -r '.[0].conclusion // ""')"
            url="$(printf '%s' "$json" | jq -r '.[0].url // ""')"
            created="$(printf '%s' "$json" | jq -r '.[0].createdAt // ""')"
            echo "cycle=$cycle run=$run_id status=$status conclusion=$conclusion created=$created"
            if [ "$status" = "completed" ]; then
              printf '%s\n' "$run_id" > /tmp/run_id
              printf '%s\n' "$conclusion" > /tmp/conclusion
              printf '%s\n' "$url" > /tmp/url
              exit 0
            fi
            sleep 60
          done
          echo "V3 retry did not complete within four hours." >&2
          exit 1

      - name: Record result on current main
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(cat /tmp/run_id)"
          conclusion="$(cat /tmp/conclusion)"
          url="$(cat /tmp/url)"
          git fetch origin main
          git checkout -B main origin/main
          cat > V3_RETRY_STATUS.md <<EOF
          # RC3 V3 Retry Status

          - Run: $run_id
          - Conclusion: $conclusion
          - URL: $url
          - Recorded: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          EOF
          git config user.email actions@users.noreply.github.com
          git config user.name 'Scripture Games CI'
          git add V3_RETRY_STATUS.md
          git commit -m "Record RC3 V3 retry result: $conclusion"
          git push origin HEAD:main
          if [ "$conclusion" != "success" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "RC3 V3 retry needs attention — run $run_id" --body "Result: $conclusion. Review: $url"
          fi
