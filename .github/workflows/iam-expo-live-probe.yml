name: I AM ASC Integration Status

on:
  push:
    branches:
      - iam-expo-live-probe

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_NO_VCS: '1'
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}
      - name: Read exact I AM ASC link status only
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          export EAS_PROJECT_ROOT="$work"
          cd "$work"
          cat > package.json <<'JSON'
          {"name":"iam-asc-status-probe","version":"1.0.0","private":true}
          JSON
          cat > app.json <<'JSON'
          {"expo":{"name":"I AM","slug":"iam-life-companion","owner":"wscott2k8","version":"1.0.0","ios":{"bundleIdentifier":"com.stormandme.iam"},"extra":{"eas":{"projectId":"a6265184-a95b-4414-ac0d-7d8359dd0bfe"}}}}
          JSON
          eas integrations:asc:status --json --non-interactive > asc-status.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('asc-status.json','utf8'));
          const app=x?.appStoreConnectApp ?? x?.app?.appStoreConnectApp ?? x?.metadata?.appStoreConnectApp ?? null;
          const key=x?.appStoreConnectApiKey ?? x?.app?.appStoreConnectApiKey ?? x?.metadata?.appStoreConnectApiKey ?? null;
          console.log('ASC_APP_LINK_PRESENT=' + Boolean(app));
          console.log('ASC_API_KEY_LINK_PRESENT=' + Boolean(key));
          if (app) console.log('ASC_APP_SAFE=' + JSON.stringify({ascAppIdentifier:app.ascAppIdentifier??app.id??null,bundleIdentifier:app.bundleIdentifier??null,name:app.name??null}));
          NODE
