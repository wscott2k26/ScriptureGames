name: I AM Expo Live Probe

on:
  push:
    branches:
      - iam-expo-live-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_NO_VCS: '1'
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}

      - name: Verify Expo identity
        shell: bash
        run: |
          set -euo pipefail
          eas account:view

      - name: Inspect finished I AM build 6 and Apple submission state
        shell: bash
        run: |
          set -euo pipefail
          eas build:view 796c5493-0ed7-4233-98ca-f3e89505c2c7 --json > build.json
          node <<'NODE'
          const fs=require('fs');
          let x=JSON.parse(fs.readFileSync('build.json','utf8'));
          if (Array.isArray(x)) x=x[0];
          console.log('BUILD6=' + JSON.stringify({id:x.id,status:x.status,appVersion:x.appVersion,appBuildVersion:x.appBuildVersion,createdAt:x.createdAt,updatedAt:x.updatedAt,message:x.message??null,buildProfile:x.buildProfile,distribution:x.distribution}));
          const submissions=Array.isArray(x.submissions)?x.submissions:[];
          console.log('BUILD6_SUBMISSION_COUNT=' + submissions.length);
          for (const s of submissions) {
            console.log('SUBMISSION_SUMMARY=' + JSON.stringify({id:s.id,status:s.status,createdAt:s.createdAt,updatedAt:s.updatedAt,submissionPlatform:s.submissionPlatform??s.platform??null}));
          }
          NODE
