name: I AM Build 6 Team ID Probe

on:
  push:
    branches:
      - iam-expo-live-probe

permissions:
  contents: read

jobs:
  inspect-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_NO_VCS: '1'
      I_AM_BUILD_ID: 796c5493-0ed7-4233-98ca-f3e89505c2c7
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}
      - name: Read signing team from finished Build 6 IPA
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          export EAS_PROJECT_ROOT="$work"
          cd "$work"
          cat > package.json <<'JSON'
          {"name":"iam-build6-team-probe","version":"1.0.0","private":true}
          JSON
          cat > app.json <<'JSON'
          {"expo":{"name":"I AM","slug":"iam-life-companion","owner":"wscott2k8","version":"1.0.0","ios":{"bundleIdentifier":"com.stormandme.iam"},"extra":{"eas":{"projectId":"a6265184-a95b-4414-ac0d-7d8359dd0bfe"}}}}
          JSON
          eas build:view "$I_AM_BUILD_ID" --json > build.json
          node <<'NODE' > artifact-url.txt
          const b=require('./build.json'); const x=Array.isArray(b)?b[0]:b;
          if(x.id!=='796c5493-0ed7-4233-98ca-f3e89505c2c7'||x.status!=='FINISHED'||x.appBuildVersion!=='6') process.exit(2);
          const url=x.artifacts?.applicationArchiveUrl||x.artifacts?.buildUrl; if(!url) process.exit(3); process.stdout.write(url);
          NODE
          curl --fail --silent --show-error --location "$(cat artifact-url.txt)" --output build6.ipa
          unzip -q build6.ipa -d ipa
          appdir="$(find ipa/Payload -maxdepth 1 -type d -name '*.app' | head -n1)"
          openssl smime -inform der -verify -noverify -in "$appdir/embedded.mobileprovision" -out profile.plist >/dev/null 2>&1
          python3 - "$appdir/Info.plist" profile.plist <<'PY'
          import plistlib,sys
          with open(sys.argv[1],'rb') as f: info=plistlib.load(f)
          with open(sys.argv[2],'rb') as f: profile=plistlib.load(f)
          teams=profile.get('TeamIdentifier') or []
          team=teams[0] if teams else ''
          bundle=info.get('CFBundleIdentifier','')
          build=str(info.get('CFBundleVersion',''))
          print('BUILD6_TEAM_IDENTIFIER=' + team)
          print('BUILD6_BUNDLE_MATCH=' + ('true' if bundle=='com.stormandme.iam' else 'false'))
          print('BUILD6_BUNDLE_VERSION_MATCH=' + ('true' if build=='6' else 'false'))
          if not team or bundle!='com.stormandme.iam' or build!='6': raise SystemExit(7)
          PY
